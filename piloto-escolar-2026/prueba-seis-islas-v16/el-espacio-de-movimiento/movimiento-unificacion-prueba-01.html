:4px solid #e5ae37;background:#fff7e8;border-radius:10px;line-height:1.55}.nav{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.next{background:#f9cb6b;font-weight:700}.next:disabled{opacity:.4;cursor:not-allowed}.small{font-size:13px;color:#5b5d70}.thread{height:65px;overflow:visible;width:100%}.thread path{fill:none;stroke:#dca526;stroke-width:5;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;animation:weave 4s forwards}@keyframes weave{to{stroke-dashoffset:0}}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.hotspot{display:none}.panel{padding:16px}.question{font-size:18px}}
</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}</style><style id="island-unification">:root{color:#283e38;background:#e9eee9}.wrap{max-width:1160px;padding:12px 14px 0}.island-return{margin:0 0 8px 8px;font-size:13px}.island-return a{color:#64746b;text-decoration:none}.island-return a:hover{text-decoration:underline}.island-shell{background:#fffaf0;border:1px solid #e1e7dd;border-radius:30px;box-shadow:0 20px 65px #37524718;overflow:hidden}.top{padding:7px 26px;min-height:78px;border-bottom:1px solid #e9e6dc;flex-direction:row;align-items:center}.brand-logo{width:132px;max-height:70px;object-fit:contain}.moment-dots{display:flex;gap:8px}.moment-dot{width:10px;height:10px;border-radius:50%;background:#d9ded6}.moment-dot.active{background:#4b806b}.island-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5.5% 0}.island-heading h1{font-size:28px;font-weight:500;margin:0}.age button{padding:8px 14px;color:#283e38;border-color:#d8dfd5}.age button[aria-pressed=true]{background:#dce8d8;border-color:#81aa88}#app{max-width:820px;margin:auto;padding:0 14px 12px}.scene{margin-top:12px}.panel{background:transparent;box-shadow:none;padding:12px 0 0;margin:0}.eyebrow{color:#a46d56;letter-spacing:.15em;font-size:12px;font-weight:bold;text-transform:uppercase;margin:0 0 6px}.narrative-title{font-size:30px;line-height:1.16;font-weight:500;margin:0 0 10px}.dialogue{font-size:17px;line-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:38px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style><style>.island-shell:has(.closing-panel) #app{max-width:none;padding:0 0 12px}.closing-panel{max-width:none;padding:4px 0 0}.closing-panel>p,.closing-panel>h2,.closing-panel>nav{max-width:792px;margin-left:auto;margin-right:auto;width:calc(100% - 28px)}.union-knot-wide{width:100%;height:96px;overflow:hidden;display:flex;align-items:center;margin:0 0 14px}.union-knot-wide img{display:block;width:100%;height:auto;flex:none}@media(max-width:700px){.union-knot-wide{height:65px}}</style><style>.scene.garden{aspect-ratio:3/1;background:#e7e1d8}.scene.garden img{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><main class="wrap"><div class="island-return"><a href="../mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const scenes=[{"image":"momento-1.png","q":"¿Por qué creen que Gügo se queda mirando el aro?","options":["Porque le gustaría llegar hasta él.","Porque cree que necesita volar como Pakik.","Porque todavía no sabe cómo podría llegar."],"ref":[["Gügo también quiere llegar al aro. Puede sentir curiosidad o un poquito de tristeza al ver que Pakik llega volando. ¿Qué le podríamos decir para animarlo a buscar su manera?","Pakik tiene alas y Gügo no. Pero Gügo puede moverse de otras maneras. ¿Qué podría usar para acercarse al aro?","Gügo todavía no sabe cómo llegar. Puede mirar alrededor, preguntar o probar algo nuevo. No tiene que descubrirlo todo de una vez."],["Gügo desea llegar al aro y observa que Pakik lo hace con facilidad. Es natural sentir dudas cuando vemos que alguien puede hacer algo de otra manera. Podemos escuchar lo que Gügo quiere antes de ofrecerle ayuda.","A veces vemos cómo alguien consigue algo y pensamos que debemos hacerlo igual. Gügo puede buscar otra manera de llegar sin tener que cambiar quién es.","No encontrar una solución inmediatamente no significa que no exista. Gügo puede observar el espacio, conversar con Pakik y decidir qué quiere intentar."],["Al comparar sus capacidades con las de Pakik, Gügo podría pensar que tiene menos posibilidades. Sin embargo, una diferencia en la manera de moverse no determina su valor ni todas sus oportunidades. ¿Qué alternativas o apoyos podría explorar?","Confundir una forma de alcanzar una meta con la única forma posible puede crear barreras. Reconocer distintas maneras de participar permite buscar alternativas sin exigir que todos tengan las mismas capacidades.","No conocer una solución no equivale a carecer de capacidad. Explorar el entorno y reconocer los apoyos disponibles permite distinguir entre una dificultad personal y una barrera que podemos transformar."]]},{"image":"momento-2.png","q":"¿Qué les parece lo que Pakik le responde a Gügo?","options":["Que no necesita ser igual a Pakik.","Que todavía pueden existir otras posibilidades.","Que Pakik lo escucha sin burlarse."],"ref":[["Gügo no necesita tener alas para ser él mismo. Pakik puede quererlo y jugar con él tal como es.","Gügo puede mirar la escalera y descubrir si le sirve. Pakik puede estar cerca mientras lo intenta.","Pakik escucha a Gügo sin reírse. Cuando alguien nos escucha así, podemos contarle lo que sentimos."],["Pakik le recuerda a Gügo que no necesita imitarlo para participar. Escuchar esas palabras puede ayudarle a confiar en sus propias maneras de hacer las cosas.","Pakik no promete que llegar será fácil. Le ayuda a descubrir una posibilidad sin decidir por él ni exigirle que consiga un resultado.","Pakik no se burla de las dudas de Gügo ni le dice que son tontas. Escuchar con respeto puede ayudar a alguien a sentirse acompañado y a expresar lo que necesita."],["Acompañar implica reconocer a la otra persona sin exigir que se adapte a nuestra manera de actuar. La inclusión no consiste en hacer que todos sean iguales, sino en respetar sus diferencias y facilitar su participación.","Reconocer posibilidades no significa asegurar que cualquier meta sea alcanzable. El apoyo respetuoso permite explorar alternativas, reconocer límites y decidir libremente qué intentar.","Escuchar sin juzgar reconoce la experiencia de la otra persona. Antes de ofrecer soluciones, podemos comprender sus inquietudes y preguntarle qué apoyo desea, sin minimizar las dificultades que enfrenta."]]},{"image":"momento-3.png","q":"¿Qué podría hacer Pakik mientras Gügo sube?","options":["Quedarse cerca por si necesita ayuda.","Preguntarle si quiere que lo ayude.","Animarlo sin decirle cómo tiene que hacerlo."],"ref":[["Pakik puede quedarse cerquita de Gügo. Si Gügo necesita ayuda, puede pedírsela. También puede disfrutar intentando subir solo.","Pakik puede preguntar: «¿Quieres ayuda?». Gügo puede decir que sí, que no o explicar qué necesita.","Pakik puede decirle: «Estoy aquí. Tómate tu tiempo». Gügo no necesita subir deprisa para que su amigo esté contento."],["Estar cerca no significa hacer todo por Gügo. Pakik puede darle tiempo para probar y estar disponible si necesita apoyo.","Preguntar antes de ayudar permite que Gügo decida cómo quiere subir. Así puede recibir apoyo sin perder la oportunidad de hacer las cosas por sí mismo.","Animar a alguien no significa exigirle que termine. Pakik puede respetar las pausas de Gügo y acompañarlo aunque decida dejar de subir."],["Acompañar requiere equilibrar disponibilidad y respeto por la autonomía. Observar y escuchar permite ofrecer apoyo cuando se necesita, sin sustituir las decisiones ni las acciones de la otra persona.","Ayudar sin consultar puede limitar la autonomía, incluso cuando tenemos buenas intenciones. Preguntar y respetar la respuesta permite construir un apoyo ajustado a las necesidades y decisiones de quien lo recibe.","El ánimo puede convertirse en presión cuando condicionamos el reconocimiento a un resultado. Acompañar respetuosamente significa valorar las decisiones y el esfuerzo de la persona, incluso si cambia de meta o necesita detenerse."]]},{"image":"momento-4.png","q":"¿Por qué creen que Pakik celebra cuando Gügo llega?","options":["Porque está feliz por el descubrimiento de su amigo.","Porque sabe que Gügo hizo el recorrido a su ritmo.","Porque pudieron compartir la alegría sin competir."],"ref":[["Pakik está feliz porque Gügo encontró su manera de llegar. Podemos alegrarnos por nuestros amigos sin tener que hacer lo mismo que ellos.","Gügo subió poquito a poquito. Pakik esperó y celebró con él. Cada uno puede necesitar un tiempo diferente.","Pakik y Gügo pueden estar felices juntos. No necesitan saber quién llegó primero ni quién fue más rápido."],["Pakik celebra lo que Gügo descubrió, no que haya conseguido volar como él. Podemos reconocer los logros de otras personas aunque sean diferentes de los nuestros.","Pakik respetó el ritmo de Gügo y no lo apuró. Necesitar más tiempo no hace que un logro sea menos importante.","Compartir la alegría sin competir permite disfrutar de lo que cada persona consigue. Podemos jugar juntos sin convertir cada experiencia en una carrera."],["Celebrar un logro propio de otra persona reconoce su autonomía y sus capacidades. No necesitamos medirlo según nuestra experiencia ni convertirlo en una comparación para darle valor.","Medir todas las capacidades con el mismo ritmo puede invisibilizar esfuerzos y necesidades diferentes. Respetar los tiempos individuales permite valorar la participación sin imponer una única medida de éxito.","Cuando dejamos de comparar los logros con una sola regla, podemos reconocer distintas formas de participar y aprender. La convivencia se fortalece cuando celebramos las capacidades de los demás sin establecer quién vale más."]]}];const DIALOGUES=[[["n","Pakik se acerca volando al aro amarillo. Para él, llegar hasta allí parece sencillo."],["n","Desde abajo, Gügo lo observa. Mira sus propias posibilidades de movimiento y después vuelve a mirar a Pakik."],["Gügo","¡Qué alto está! Tú puedes llegar volando."]],[["n","Gügo sigue mirando hacia arriba."],["Gügo","Es que yo no soy como tú."],["n","Pakik lo escucha y responde:"],["Pakik","No tienes que ser como yo. Todavía no sabemos cómo sería hacerlo a tu manera."],["n","Gügo vuelve a mirar el aro. Esta vez, también observa la escalera."]],[["n","Gügo se acerca a la escalera."],["n","No tiene alas. Pero puede sujetarse, avanzar y buscar dónde apoyarse."],["n","Comienza a subir."],["n","A veces se detiene para encontrar el siguiente apoyo. Pakik permanece cerca, atento, sin apresurarlo ni subir por él."]],[["n","Después de avanzar poco a poco, Gügo llega hasta el aro."],["n","Mira hacia abajo. Allí está Pakik, celebrando con él."],["Gügo","¡Llegué! ¡Y no tuve que volar!"],["n","Pakik lo mira feliz."],["Pakik","Encontraste tu manera."],["n","Gügo sonríe. Antes pensaba que no podía llegar porque no tenía alas. Ahora sabe que había una posibilidad que todavía no había descubierto."]]];const closing=[["Gügo encontró su manera de llegar al aro. Nadie merece burlas por moverse de otra manera o necesitar más tiempo.","¿Qué puedes hacer si alguien se burla de un amigo porque se mueve de otra manera?","No reírte, escuchar a tu amigo y pedir ayuda a una persona adulta si lo están lastimando."],["Pakik acompañó a Gügo sin compararlo ni presionarlo. Las burlas sobre las capacidades o el ritmo de alguien pueden hacer que deje de participar.","¿Qué puedes hacer si alguien es rechazado porque necesita más tiempo o apoyo?","No sumarte a las burlas, preguntarle qué necesita y buscar ayuda de una persona adulta de confianza."],["Las diferencias en nuestras capacidades no justifican la humillación ni la exclusión. Las burlas y comparaciones repetidas pueden convertirse en bullying y limitar la participación.","¿Cómo puedes ayudar cuando alguien es excluido por sus capacidades o su manera de moverse?","No reforzar el rechazo, escuchar qué apoyo desea y buscar ayuda de una persona adulta de confianza."]];
let age=1,step=0,selected=[null,null,null,null],showClosing=false;const app=document.getElementById("app");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function revealIfNeeded(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const target=document.querySelector(".reflection")||document.querySelector(".question");if(!target)return;const r=target.getBoundingClientRect();const safeTop=20,safeBottom=window.innerHeight-80;let delta=0;if(r.height>safeBottom-safeTop){delta=r.top-safeTop}else if(r.bottom>safeBottom){delta=r.bottom-safeBottom}else if(r.top<safeTop){delta=r.top-safeTop}if(Math.abs(delta)>4)window.scrollBy({top:delta,behavior:"smooth"})}))}
const headings=[["Descubrir nuestras posibilidades","Allá arriba"],["Reconocer nuestras diferencias","Yo no soy como tú"],["Aprender a acompañar","A mi manera"],["Valorar nuestros propios logros","Lo descubrí"]];function render(){document.getElementById("pedagogicalHeading").textContent=showClosing?"Para llevar contigo":headings[step][0];document.getElementById("narrativeHeading").textContent=showClosing?"El hilo que nos une":headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===(showClosing?4:step)?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(showClosing?5:step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(showClosing){app.innerHTML='<section class="panel closing-panel"><div class="union-knot-wide"><img src="../../revision-menu-tres-experiencias/hilo-que-nos-une.png" alt="Dos hilos dorados unidos en un nudo central"></div><p>'+closing[age][0]+'</p><h2>'+closing[age][1]+'</h2><p>'+closing[age][2]+'</p><p><strong>No necesitamos hacer las cosas de la misma manera para compartirlas. Cada persona merece participar a su ritmo y con respeto.</strong></p><p>El hilo amarillo siguió su camino, uniendo las distintas maneras de participar.</p><nav class="nav"><button class="next secondary" id="closingBack">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("closingBack").onclick=()=>{showClosing=false;render();window.scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];showClosing=false;render()};return}
const s=scenes[step];let out='<div class="scene '+'garden'+'"><img src="'+encodeURI(s.image)+'" alt="Ilustración aprobada de El Espacio de Movimiento, momento '+(step+1)+'"></div><section class="panel">';
const twoStates=true;
if(twoStates&&selected[step]!==null){
 out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>';
}else{
 out+='<div class="dialogue">'+DIALOGUES[step].map(d=>d[0]==='n'?'<p>'+escapeHtml(d[1])+'</p>':'<p><b>'+escapeHtml(d[0])+':</b> —'+escapeHtml(d[1])+'</p>').join("")+'</div><div class="question">'+s.q+'</div>';
 out+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'" aria-pressed="'+(selected[step]===i)+'">'+escapeHtml(o)+'</button>').join("")+'</div>';
 if(!twoStates&&selected[step]!==null)out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div>';
}
out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';
app.innerHTML=out;
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();revealIfNeeded()});
const change=document.getElementById("change");if(change)change.onclick=()=>{selected[step]=null;render();revealIfNeeded()};
document.getElementById("back").onclick=()=>{step--;render();window.scrollTo(0,0)};
document.getElementById("forward").onclick=()=>{if(step===3)showClosing=true;else step++;render();window.scrollTo(0,0)};
}
document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{age=+b.dataset.age;render()});render();
</script></body></html>
