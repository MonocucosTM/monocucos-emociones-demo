</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}.mc-legal-footer{width:min(calc(100% - 32px),1132px);margin:auto}</style><style>html,body{height:auto;min-height:100%;background:#e9eee9;color:#283e38}body{display:block}.island-wrap{max-width:1160px;margin:auto;padding:12px 14px 0}.island-return{margin:0 0 8px 8px;font-size:13px}.island-return a{color:#64746b;text-decoration:none}.island-shell{background:#fffaf0;border:1px solid #e1e7dd;border-radius:30px;overflow:hidden;box-shadow:0 20px 65px #37524718}.island-top{display:flex;justify-content:space-between;align-items:center;min-height:78px;padding:7px 26px;border-bottom:1px solid #e9e6dc}.island-top img{width:132px;max-height:70px;object-fit:contain}.moment-dots{display:flex;gap:8px}.moment-dot{width:10px;height:10px;border-radius:50%;background:#d9ded6}.moment-dot.active{background:#4b806b}.header{width:100%;padding:20px 5.5% 0}.header-main{flex-wrap:nowrap}.moment-heading{flex:1;min-width:0}.moment-heading p{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold;color:#a46d56;margin:0 0 8px}.moment-heading h1{font-size:44px;font-weight:400;line-height:1.16;margin:0}.age-buttons{flex-shrink:0;padding-top:5px}.age-buttons button{padding:8px 14px;color:#283e38;border-color:#d8dfd5}.age-buttons button[aria-pressed=true]{background:#dce8d8;border-color:#81aa88}#recorrido{width:100%;height:700px;background:transparent;display:block}.mc-legal-footer{width:100%}@media(max-width:700px){.header-main{flex-wrap:wrap}.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}.island-top{min-height:62px;padding:6px 18px}.island-top img{width:112px}}</style></head><body><main class="island-wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><div class="island-top"><img src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div id="progress" class="moment-dots"></div></div><header class="header"><div class="header-main"><div class="moment-heading"><p id="pedagogical">Reconocer nuestras necesidades</p><h1 id="narrative">Ahora necesito descansar</h1></div><div class="age-buttons" role="group" aria-label="Edad para las reflexiones"><button type="button" data-age="4" aria-pressed="false" onclick="elegirEdad(4)">4–5 años</button><button type="button" data-age="6" aria-pressed="true" onclick="elegirEdad(6)">6–8 años</button><button type="button" data-age="9" aria-pressed="false" onclick="elegirEdad(9)">9–10 años</button></div></div></header><iframe id="recorrido" title="El Rincón Tranquilo" onload="ocultarDuplicados(this)" src="Rincon_Tranquilo_recorrido_integrado_textos_corregidos.html" allowfullscreen></iframe></div><script>
let edadElegida='6';
function marcarEdad(){document.querySelectorAll('.age-buttons button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===edadElegida)))}
function aplicarEdad(doc){try{const select=doc.getElementById('age');if(select){if(select.value!==edadElegida){select.value=edadElegida;select.dispatchEvent(new Event('change',{bubbles:true}))}const line=select.closest('.age-line');if(line)line.style.display='none';if(!select.dataset.sincronizado){select.dataset.sincronizado='1';select.addEventListener('change',()=>{edadElegida=select.value;marcarEdad()})}}}catch(e){}}
function elegirEdad(n){edadElegida=String(n);marcarEdad();try{const doc=document.getElementById('recorrido').contentDocument;doc.querySelectorAll('.frame-shell iframe').forEach(f=>{if(f.contentDocument)aplicarEdad(f.contentDocument)});const closing=doc.getElementById('ages');if(closing){const i={'4':0,'6':1,'9':2}[edadElegida];if(typeof doc.defaultView.setAge==='function')doc.defaultView.setAge(i)}}catch(e){}}
function ocultarDuplicados(frame){try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent=`:root,body{background:#fffaf0;color:#283e38}.app{max-width:820px;padding:12px 14px}.top,.section-label,.note,#ages,.content>h1{display:none!important}.stage{background:transparent;box-shadow:none;border-radius:0;overflow:visible}.stage iframe{height:500px}.nav{padding:12px 0 0}.ghost,.primary{font-size:15px;padding:10px 19px}.ghost{background:transparent;color:#436e5a;border:1px solid #d8dfd5}.primary{background:#4b806b}.primary:disabled{opacity:.4;cursor:not-allowed}.hero{border-radius:24px}.content{margin:12px auto;padding:0}.content p,.content li{font-size:17px;line-height:1.55}`;doc.head.appendChild(style);
const headings=['Reconocer nuestras necesidades','Comprender el daño de las etiquetas','Valorar nuestra manera de ser','Aprender a conocernos','Para llevar contigo'];const titles=['Ahora necesito descansar','Dicen que soy aburrido','Así soy yo','Ahora quiero conocerte','El hilo que nos une'];
function sync(){const active=[...doc.querySelectorAll('#dots .dot')].findIndex(b=>b.classList.contains('on'));const n=Math.max(0,active);document.getElementById('pedagogical').textContent=headings[n];document.getElementById('narrative').textContent=titles[n];document.getElementById('progress').innerHTML=titles.map((_,i)=>'<span class="moment-dot'+(i===n?' active':'')+'"></span>').join('');document.getElementById('progress').setAttribute('aria-label','Momento '+(n+1)+' de 5');const inner=doc.querySelector('.frame-shell.active iframe');const next=doc.getElementById('next');const prev=doc.getElementById('prev');prev.textContent='← Anterior';next.textContent=n===4?'Volver a empezar':n===3?'Descubrir el hilo →':'Continuar →';next.disabled=n<4&&(!inner?.contentDocument?.getElementById('reflection')||inner.contentDocument.getElementById('reflection').hidden);if(inner){const d=inner.contentDocument;if(d?.body){const h=d.querySelector('main.wrap')?.getBoundingClientRect().height;if(h>0)inner.style.height=Math.ceil(h)+'px'}}const h=doc.querySelector('main.app')?.getBoundingClientRect().height;if(h>0)frame.style.height=Math.ceil(h)+'px'}
function ajustar(inner){try{const d=inner.contentDocument;if(!d||!d.body)return;if(!d.getElementById('unified')){const st=d.createElement('style');st.id='unified';st.textContent=`body{background:#fffaf0;color:#283e38}.wrap{max-width:none;padding:0}.wrap>header,.age-line,.note{display:none!important}.scene{border-radius:24px;box-shadow:none}.controls{margin:8px 0;gap:8px}.controls button{background:transparent;color:#436e5a;border:1px solid #d8dfd5;padding:7px 12px;font-size:13px}.learning{max-width:none;margin:12px 0 0;padding:0;background:transparent;border:0;box-shadow:none}.learning h2{font-size:19px;font-weight:700;margin:0 0 9px}.choices{gap:9px}.choices button{background:white;border:1px solid #d8dfd5;color:#283e38;font-size:16px;padding:10px 15px}.reflection{margin:0;padding:12px;border:0;border-left:4px solid #81aa88;border-radius:10px;background:#edf3e8}.reflection h3{font-size:17px;font-weight:700}.reflection p{font-size:17px}.reflection-actions{margin-top:10px}.reflection-actions #continue{display:none}.reflection-actions #another{width:100%;background:white;color:#283e38;border:1px solid #d8dfd5}.learning:has(.reflection:not([hidden])) .choices,.learning:has(.reflection:not([hidden])) h2,.learning:has(.reflection:not([hidden])) #instruction{display:none}#instruction{font-size:13px;color:#65766d;margin:0 0 8px}`;d.head.appendChild(st);new ResizeObserver(sync).observe(d.querySelector('main.wrap'));new MutationObserver(sync).observe(d.getElementById('reflection'),{attributes:true,attributeFilter:['hidden']});}aplicarEdad(d);sync()}catch(e){}}
doc.querySelectorAll('.frame-shell iframe').forEach(inner=>{inner.addEventListener('load',()=>ajustar(inner));if(inner.contentDocument?.readyState==='complete')ajustar(inner)});new MutationObserver(()=>{sync();const inner=doc.querySelector('.frame-shell.active iframe');if(inner)ajustar(inner);else doc.defaultView.setAge({'4':0,'6':1,'9':2}[edadElegida]);window.scrollTo(0,0)}).observe(doc.getElementById('dots'),{childList:true});new ResizeObserver(sync).observe(doc.querySelector('main.app'));sync();
}catch(e){console.warn('No se pudo ajustar el encabezado interno',e)}}
