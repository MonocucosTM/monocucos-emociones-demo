</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}</style><style id="island-unification">:root{color:#283e38;background:#e9eee9}.wrap{max-width:1160px;padding:12px 14px 0}.island-return{margin:0 0 8px 8px;font-size:13px}.island-return a{color:#64746b;text-decoration:none}.island-return a:hover{text-decoration:underline}.island-shell{background:#fffaf0;border:1px solid #e1e7dd;border-radius:30px;box-shadow:0 20px 65px #37524718;overflow:hidden}.top{padding:7px 26px;min-height:78px;border-bottom:1px solid #e9e6dc;flex-direction:row;align-items:center}.brand-logo{width:132px;max-height:70px;object-fit:contain}.moment-dots{display:flex;gap:8px}.moment-dot{width:10px;height:10px;border-radius:50%;background:#d9ded6}.moment-dot.active{background:#4b806b}.island-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5.5% 0}.island-heading h1{font-size:28px;font-weight:500;margin:0}.age button{padding:8px 14px;color:#283e38;border-color:#d8dfd5}.age button[aria-pressed=true]{background:#dce8d8;border-color:#81aa88}#app{max-width:820px;margin:auto;padding:0 14px 12px}.scene{margin-top:12px}.panel{background:transparent;box-shadow:none;padding:12px 0 0;margin:0}.eyebrow{color:#a46d56;letter-spacing:.15em;font-size:12px;font-weight:bold;text-transform:uppercase;margin:0 0 6px}.narrative-title{font-size:30px;line-height:1.16;font-weight:500;margin:0 0 10px}.dialogue{font-size:17px;line-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:44px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style><style>.island-shell:has(.closing-panel) #app{max-width:none;padding:0 0 12px}.closing-panel{max-width:none;padding:4px 0 0}.closing-panel>p,.closing-panel>h2,.closing-panel>nav{max-width:792px;margin-left:auto;margin-right:auto;width:calc(100% - 28px)}.union-knot-wide{width:100%;height:96px;overflow:hidden;display:flex;align-items:center;margin:0 0 14px}.union-knot-wide img{display:block;width:100%;height:auto;flex:none}@media(max-width:700px){.union-knot-wide{height:65px}}</style></head><body><main class="wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../prueba-seis-islas-v16/mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const scenes=[
{image:"Interfaz infantil colorida con Uli e Issa.png",dialogue:[["Issa","¡Uli, mira cuántos caminos unen las islas!"],["Uli","¡Y mira ese pequeño hilo dorado entre las flores!"],["Issa","¡No lo había visto!"]],q:"¿Por qué crees que Issa y Uli descubren cosas diferentes?",options:["Porque miran lugares distintos.","Porque tienen alturas diferentes.","Porque prestan atención a otras cosas."],ref:[["Issa ve caminos lejanos y Uli descubre un hilo entre las flores. Si solo escucharan a uno, se perderían lo que encontró el otro. ¿Qué te gustaría que se mostraran entre sí?","Issa es alta y Uli es pequeño. Algunas cosas se ven mejor desde arriba y otras desde cerca. Pero ser más alto no significa descubrir cosas más importantes. ¿Has visto algo que otra persona no había notado?","Los dos están en el mismo lugar, pero se fijan en cosas diferentes. A Issa le llaman la atención los caminos; a Uli, el hilo entre las flores. Escucharse les permite descubrir algo nuevo sin dejar de disfrutar lo que a cada uno le gusta."],["Aunque comparten la misma isla, Issa y Uli pueden mirar hacia lugares distintos. Cuando contamos lo que vemos y escuchamos al otro, descubrimos detalles que quizá nos habríamos perdido. ¿Qué pasaría si uno dijera que lo que vio el otro no importa?","La altura de Issa le permite ver caminos lejanos, mientras Uli descubre detalles cercanos a las flores. Ninguna capacidad convierte a uno en mejor observador. Las diferencias pueden ayudarnos a conocer más si nos escuchamos con respeto.","No siempre prestamos atención a lo mismo, incluso cuando estamos juntos. Lo que interesa a Issa puede ser diferente de lo que entusiasma a Uli. Escuchar no exige cambiar nuestros gustos: significa reconocer que el descubrimiento de otra persona también puede tener valor."],["Mirar hacia lugares distintos puede llevarnos a interpretaciones diferentes de un mismo entorno. La perspectiva de Issa no invalida la de Uli, ni al contrario. Escuchar otra mirada amplía nuestra comprensión sin obligarnos a pensar igual. ¿Qué perderían si solo aceptaran una?","Nuestra posición influye en aquello que podemos percibir: Issa distingue caminos a lo lejos y Uli aprecia detalles cercanos. Tener una ventaja para observar algo no hace que una persona sea superior. Reconocer los límites de nuestra mirada es una forma de respetar las demás.","Nuestros intereses también influyen en lo que notamos. Dos personas pueden compartir una experiencia y encontrar significados diferentes. No tienen que coincidir para escucharse. El problema aparece cuando alguien considera que su manera de ver las cosas es la única válida y descalifica a quien piensa distinto."]]},
{image:"Interfaz infantil colorida con Uli e Issa.png",dialogue:[["Issa","Desde aquí alcanzo a ver caminos que parecen hilos entre las islas."],["Uli","¡Qué lejos puedes mirar, Issa!"],["Issa","Sí, Uli. Pero me pregunto qué estarás viendo tú desde allá abajo."]],q:"¿Qué podría hacer Issa para compartir su mirada sin dejar de valorar la de Uli?",options:["Pedirle a Uli que mire solamente hacia el horizonte.","Contarle a Uli lo que ve y escuchar lo que él descubre.","Pensar que su mirada es mejor porque alcanza más lejos."],ref:[["Issa puede mostrarle los caminos a Uli, pero él también tiene algo que enseñarle. Si solo miran hacia donde Issa quiere, podrían perderse el pequeño hilo. ¿Qué podrían hacer para disfrutar los dos de sus descubrimientos?","Issa puede contarle a Uli lo que ve y preguntarle qué ha encontrado él. Así los dos tienen un momento para hablar y otro para escuchar. ¡Pueden descubrir juntos cosas nuevas!","Issa alcanza a ver muy lejos, pero Uli puede encontrar cosas que ella no ve. Si Issa le dice que su mirada es mejor, Uli podría sentirse triste y dejar de contarle sus descubrimientos. Los dos tienen algo valioso que compartir."],["Compartir no significa pedirle al otro que abandone su manera de mirar. Si Issa solo quiere que Uli observe el horizonte, él podría sentir que sus descubrimientos no interesan. ¿Cómo podría Issa mostrarle los caminos y también darle espacio para contar lo que ve?","Cuando Issa cuenta lo que observa y escucha a Uli, ambos descubren algo que antes no conocían. Escuchar con curiosidad ayuda a que el otro se sienta valorado. Podemos practicarlo cuando un compañero nos cuenta algo que le gusta, aunque a nosotros nos interese otra cosa.","La altura de Issa le permite observar algunos elementos, pero no hace que su mirada sea mejor que la de Uli. Si utilizamos nuestras capacidades para sentirnos superiores, podemos hacer que otros se sientan menos importantes. Podemos compartir lo que sabemos sin dejar de valorar lo que los demás saben."],["Pedirle a alguien que adopte nuestra perspectiva puede hacer que sus propios descubrimientos queden sin escuchar. Issa puede invitar a Uli a conocer los caminos sin convertir esa invitación en una obligación. En un grupo, dar espacio a otras miradas permite que todos participen sin renunciar a sus intereses.","Escuchar otra mirada amplía nuestra comprensión sin exigir que lleguemos a la misma conclusión. Issa puede hacer preguntas a Uli para entender qué le interesa de las flores. Esa curiosidad también nos ayuda a convivir con compañeros cuyas preferencias o ideas son distintas de las nuestras.","Tener una ventaja para observar ciertos detalles no otorga superioridad personal. Si Issa utilizara su altura para descalificar a Uli, convertiría una diferencia física en una razón para excluirlo. Reconocer nuestras capacidades implica también reconocer sus límites y valorar las aportaciones de los demás."]]},
{image:"El_Mirador_Momento_3_recorte_original_sin_reinterpretacion.png",dialogue:[["Uli","¡Issa, mira! Entre estas flores hay un hilo dorado muy pequeñito."],["Issa","Desde arriba casi no lo distinguía."],["Uli","A mí me encanta descubrir esas pequeñas cosas."]],q:"¿Qué podría hacer Uli con su descubrimiento?",options:["Decir que las flores no importan porque son pequeñas.","Compartir con Issa lo que ha descubierto.","Guardar su descubrimiento porque Issa es más alta."],ref:[["Aunque las flores sean pequeñas, pueden ser muy importantes para Uli. A veces algo que nos parece pequeño hace muy feliz a otra persona. ¿Cómo te sentirías si alguien dijera que lo que te gusta no importa?","Uli puede mostrarle a Issa el hilo que encontró entre las flores. Ella podrá descubrir algo nuevo gracias a él. Cuando compartimos lo que nos gusta, ayudamos a nuestros amigos a conocernos mejor.","Uli es pequeño, pero tiene cosas importantes que contar. No necesita ser tan alto como Issa para que ella lo escuche. Tú también puedes compartir tus descubrimientos, aunque sean diferentes de los de tus amigos."],["El tamaño de algo no determina cuánto puede significar para una persona. Si Uli desprecia las flores por ser pequeñas, podría dejar de valorar algo que realmente le gusta. No necesitamos que nuestros intereses sean importantes para todos para reconocer que tienen valor.","Al compartir su descubrimiento, Uli le permite a Issa conocer algo que ella no había visto. No necesita convencerla de que las flores son más interesantes que los caminos. Podemos mostrar a otros lo que nos entusiasma y escuchar lo que les entusiasma a ellos.","La altura de Issa no hace que los descubrimientos de Uli tengan menos valor. Si Uli guarda silencio porque se siente menos importante, ambos pierden la oportunidad de aprender algo nuevo. En un grupo, escuchar a quienes hablan menos también ayuda a que todos puedan participar."],["Descalificar un descubrimiento por parecer pequeño puede impedirnos reconocer lo que otra persona aprecia, e incluso llevarnos a ocultar nuestros propios intereses. Uli no necesita medir el valor de las flores según lo que Issa considera importante. Podemos respetar los gustos ajenos sin compartirlos.","Expresar nuestra perspectiva y escuchar otras permite compartir experiencias sin competir por quién tiene razón. Uli puede explicar por qué le interesa el hilo y dejar que Issa encuentre su propio significado. En una conversación, compartir no es imponer: es ofrecer al otro la posibilidad de conocer algo nuevo.","Sentirse menos importante por una diferencia física puede llevarnos a silenciar ideas valiosas. Si Uli cree que su tamaño determina cuánto merece ser escuchado, podría dejar de participar. En la convivencia, podemos cuestionar esas comparaciones y crear espacios donde cada persona tenga la oportunidad de expresarse."]]},
{image:"El_Mirador_Momento_4_personajes_mas_grandes.png",dialogue:[["Issa","Yo descubrí los caminos que unen las islas."],["Uli","Y yo encontré un pequeño hilo entre las flores."],["Issa","¡Qué bonito que podamos contarnos lo que vemos!"],["Uli","Aunque no miremos igual."],["Issa","¡Y no tenemos que hacerlo!"]],q:"¿Qué nos enseña el encuentro de Issa y Uli?",options:["Que uno de los dos tenía que aprender a mirar mejor.","Que sus miradas son distintas y ambas merecen respeto.","Que ahora siempre tendrán que estar de acuerdo."],ref:[["Issa y Uli no tienen que mirar de la misma manera. Cada uno descubre cosas que el otro no puede ver. Cuando escuchamos a nuestros amigos, podemos aprender de ellos sin dejar de ser como somos.","Issa y Uli ven cosas diferentes y pueden disfrutar de estar juntos. A uno le gustan los caminos y al otro las flores. ¿Qué cosas diferentes les gustan a ti y a tus amigos?","Issa y Uli pueden ser amigos aunque no siempre piensen igual. Si uno quiere mirar las flores y el otro los caminos, pueden escucharse y buscar una manera de compartir el momento sin obligarse a hacer lo mismo."],["Issa no necesita mirar como Uli, ni Uli como Issa. Imagina cómo se sentiría Uli si le dijeran que su manera de mirar está mal. Podemos aprender unos de otros sin pedirle a nadie que cambie su manera de ser.","Las diferencias de Issa y Uli les permiten descubrir cosas que no habrían conocido por separado. Pero sus miradas merecen respeto incluso cuando no les enseñan nada nuevo. En un grupo, todos merecemos ser escuchados, no solo quienes piensan como nosotros.","Respetarse no significa estar de acuerdo en todo. Issa y Uli pueden preferir cosas distintas y seguir tratándose bien. Cuando un compañero piensa diferente, podemos escuchar sus razones y expresar las nuestras sin burlarnos ni dejarlo por fuera."],["A veces confundimos nuestra manera de entender el mundo con la única manera correcta de hacerlo. Cuando intentamos imponer nuestra perspectiva, podemos hacer que otras personas dejen de expresar lo que piensan por temor a ser juzgadas. Respetar las diferencias significa reconocer el valor de otras miradas, incluso cuando no coinciden con la nuestra.","El respeto reconoce la dignidad de cada persona, incluso cuando sus experiencias y opiniones son diferentes. Issa y Uli no necesitan demostrar que sus descubrimientos son útiles para merecer un lugar juntos. En un grupo, la inclusión significa que nadie tenga que ganarse el derecho a pertenecer cambiando quién es.","El desacuerdo forma parte de la convivencia y no justifica el rechazo, la burla ni la exclusión. Podemos cuestionar una idea sin atacar a quien la expresa. Si un grupo presiona a alguien para que piense como los demás, podemos ayudar a que su voz sea escuchada sin exigir que todos estén de acuerdo."]]}
];
const closing=[
["Todos somos diferentes. A algunos nos gustan unas cosas y a otros, otras. Nadie merece que se burlen de él o lo dejen por fuera por ser diferente.","¿Qué puedes hacer si ves que no dejan jugar a alguien?","Invitarlo a participar, si quiere. Tratarlo con respeto y pedir ayuda a una persona adulta si lo están lastimando."],
["No todos vemos, sentimos o pensamos igual. Eso no hace que alguien sea mejor o peor. Cuando nos burlamos, rechazamos o dejamos por fuera a alguien por ser diferente, podemos hacerle daño. Respetar también significa escuchar, incluir y buscar ayuda cuando alguien es maltratado.","¿Qué harías si tus compañeros se burlaran de alguien por ser diferente?","No participar en las burlas, acompañar a quien está siendo excluido si es seguro hacerlo y buscar ayuda de una persona adulta de confianza."],
["Las diferencias forman parte de nuestra identidad. No necesitamos compartir todas las opiniones, intereses o capacidades para reconocernos como personas igualmente valiosas. Cuando una diferencia se utiliza para humillar, aislar o maltratar repetidamente a alguien, puede convertirse en una situación de bullying.","¿Cómo puedes ayudar cuando alguien es excluido o maltratado por ser diferente?","No reforzar las burlas, ofrecer apoyo respetando lo que la persona necesita y buscar ayuda de una persona adulta de confianza."]
];
let age=1,step=0,selected=[null,null,null,null],showClosing=false;const app=document.getElementById("app");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function revealIfNeeded(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const target=document.querySelector(".reflection")||document.querySelector(".question");if(!target)return;const r=target.getBoundingClientRect();const safeTop=20,safeBottom=window.innerHeight-80;let delta=0;if(r.height>safeBottom-safeTop){delta=r.top-safeTop}else if(r.bottom>safeBottom){delta=r.bottom-safeBottom}else if(r.top<safeTop){delta=r.top-safeTop}if(Math.abs(delta)>4)window.scrollBy({top:delta,behavior:"smooth"})}))}
const headings=[["Descubrir otras miradas","Lo que tú ves, lo que yo veo"],["Escuchar otras perspectivas","Compartir nuestra mirada"],["Valorar las diferencias","Un descubrimiento para compartir"],["Aprender a encontrarnos","Cada mirada cuenta"]];function render(){document.getElementById("pedagogicalHeading").textContent=showClosing?"Para llevar contigo":headings[step][0];document.getElementById("narrativeHeading").textContent=showClosing?"El hilo que nos une":headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===(showClosing?4:step)?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(showClosing?5:step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(showClosing){app.innerHTML='<section class="panel closing-panel"><div class="union-knot-wide"><img src="../revision-menu-tres-experiencias/hilo-que-nos-une.png" alt="Dos hilos dorados unidos en un nudo central"></div><p>'+closing[age][0]+'</p><h2>'+closing[age][1]+'</h2><p>'+closing[age][2]+'</p><p><strong>No tenemos que mirar el mundo de la misma manera para compartirlo. Cada mirada merece ser escuchada y respetada.</strong></p><p>Aquel pequeño hilo dorado no terminaba entre las flores. Seguía su camino, cruzaba el cielo y llegaba hasta otra isla.</p><nav class="nav"><button class="next secondary" id="closingBack">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("closingBack").onclick=()=>{showClosing=false;render();window.scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];showClosing=false;render()};return}
const s=scenes[step];let out='<div class="scene '+(step===0?'moment-one':step===1?'moment-two':step===2?'crop moment-three':'crop moment-four')+'"><img src="'+encodeURI(s.image)+'" alt="Ilustración aprobada de El Mirador, momento '+(step+1)+'"></div><section class="panel">';
const twoStates=true;
if(twoStates&&selected[step]!==null){
 out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>';
}else{
 out+='<div class="dialogue">'+s.dialogue.map(d=>'<p><b>'+d[0]+':</b> —'+escapeHtml(d[1])+'</p>').join("")+'</div><div class="question">'+s.q+'</div>';
 out+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'" aria-pressed="'+(selected[step]===i)+'">'+escapeHtml(o)+'</button>').join("")+'</div>';
 if(!twoStates&&selected[step]!==null)out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div>';
}
out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';

document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();revealIfNeeded()});
