</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}</style><style id="island-unification">:root{color:#283e38;background:#e9eee9}.wrap{max-width:1160px;padding:12px 14px 0}.island-return{margin:0 0 8px 8px;font-size:13px}.island-return a{color:#64746b;text-decoration:none}.island-return a:hover{text-decoration:underline}.island-shell{background:#fffaf0;border:1px solid #e1e7dd;border-radius:30px;box-shadow:0 20px 65px #37524718;overflow:hidden}.top{padding:7px 26px;min-height:78px;border-bottom:1px solid #e9e6dc;flex-direction:row;align-items:center}.brand-logo{width:132px;max-height:70px;object-fit:contain}.moment-dots{display:flex;gap:8px}.moment-dot{width:10px;height:10px;border-radius:50%;background:#d9ded6}.moment-dot.active{background:#4b806b}.island-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5.5% 0}.island-heading h1{font-size:28px;font-weight:500;margin:0}.age button{padding:8px 14px;color:#283e38;border-color:#d8dfd5}.age button[aria-pressed=true]{background:#dce8d8;border-color:#81aa88}#app{max-width:820px;margin:auto;padding:0 14px 12px}.scene{margin-top:12px}.panel{background:transparent;box-shadow:none;padding:12px 0 0;margin:0}.eyebrow{color:#a46d56;letter-spacing:.15em;font-size:12px;font-weight:bold;text-transform:uppercase;margin:0 0 6px}.narrative-title{font-size:30px;line-height:1.16;font-weight:500;margin:0 0 10px}.dialogue{font-size:17px;line-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:44px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style></head><body><main class="wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../prueba-seis-islas-v16/mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const scenes=[
{image:"Interfaz infantil colorida con Uli e Issa.png",dialogue:[["Issa","¡Uli, mira cuántos caminos unen las islas!"],["Uli","¡Y mira ese pequeño hilo dorado entre las flores!"],["Issa","¡No lo había visto!"]],q:"¿Por qué crees que Issa y Uli descubren cosas diferentes?",options:["Porque miran lugares distintos.","Porque tienen alturas diferentes.","Porque prestan atención a otras cosas."],ref:[["Issa ve caminos lejanos y Uli descubre un hilo entre las flores. Si solo escucharan a uno, se perderían lo que encontró el otro. ¿Qué te gustaría que se mostraran entre sí?","Issa es alta y Uli es pequeño. Algunas cosas se ven mejor desde arriba y otras desde cerca. Pero ser más alto no significa descubrir cosas más importantes. ¿Has visto algo que otra persona no había notado?","Los dos están en el mismo lugar, pero se fijan en cosas diferentes. A Issa le llaman la atención los caminos; a Uli, el hilo entre las flores. Escucharse les permite descubrir algo nuevo sin dejar de disfrutar lo que a cada uno le gusta."],["Aunque comparten la misma isla, Issa y Uli pueden mirar hacia lugares distintos. Cuando contamos lo que vemos y escuchamos al otro, descubrimos detalles que quizá nos habríamos perdido. ¿Qué pasaría si uno dijera que lo que vio el otro no importa?","La altura de Issa le permite ver caminos lejanos, mientras Uli descubre detalles cercanos a las flores. Ninguna capacidad convierte a uno en mejor observador. Las diferencias pueden ayudarnos a conocer más si nos escuchamos con respeto.","No siempre prestamos atención a lo mismo, incluso cuando estamos juntos. Lo que interesa a Issa puede ser diferente de lo que entusiasma a Uli. Escuchar no exige cambiar nuestros gustos: significa reconocer que el descubrimiento de otra persona también puede tener valor."],["Mirar hacia lugares distintos puede llevarnos a interpretaciones diferentes de un mismo entorno. La perspectiva de Issa no invalida la de Uli, ni al contrario. Escuchar otra mirada amplía nuestra comprensión sin obligarnos a pensar igual. ¿Qué perderían si solo aceptaran una?","Nuestra posición influye en aquello que podemos percibir: Issa distingue caminos a lo lejos y Uli aprecia detalles cercanos. Tener una ventaja para observar algo no hace que una persona sea superior. Reconocer los límites de nuestra mirada es una forma de respetar las demás.","Nuestros intereses también influyen en lo que notamos. Dos personas pueden compartir una experiencia y encontrar significados diferentes. No tienen que coincidir para escucharse. El problema aparece cuando alguien considera que su manera de ver las cosas es la única válida y descalifica a quien piensa distinto."]]},
{image:"Interfaz infantil colorida con Uli e Issa.png",dialogue:[["Issa","Desde aquí alcanzo a ver caminos que parecen hilos entre las islas."],["Uli","¡Qué lejos puedes mirar, Issa!"],["Issa","Sí, Uli. Pero me pregunto qué estarás viendo tú desde allá abajo."]],q:"¿Qué podría hacer Issa para compartir su mirada sin dejar de valorar la de Uli?",options:["Pedirle a Uli que mire solamente hacia el horizonte.","Contarle a Uli lo que ve y escuchar lo que él descubre.","Pensar que su mirada es mejor porque alcanza más lejos."],ref:[
["Issa puede mostrarle los caminos, pero Uli también tiene cosas que enseñarle.","¡Qué buena manera de compartir! Issa puede contar lo que ve y escuchar a Uli.","Ver más lejos no significa ver mejor. Uli también descubre cosas importantes."],
["Compartir no significa pedirle al otro que abandone su manera de mirar.","Al contar lo que observa y escuchar a Uli, Issa puede conocer otra perspectiva sin imponer la suya.","La altura permite observar algunos elementos, pero no convierte una perspectiva en superior."],
["Pedirle a alguien que adopte nuestra perspectiva puede hacer que sus propios descubrimientos queden sin escuchar.","Escuchar otra mirada permite ampliar nuestra comprensión sin exigir que ambos lleguen a la misma conclusión.","Una ventaja para observar ciertos detalles no otorga superioridad personal ni justifica desvalorizar otras experiencias."]]},
{image:"El_Mirador_Momento_3_recorte_original_sin_reinterpretacion.png",dialogue:[["Uli","¡Issa, mira! Entre estas flores hay un hilo dorado muy pequeñito."],["Issa","Desde arriba casi no lo distinguía."],["Uli","A mí me encanta descubrir esas pequeñas cosas."]],q:"¿Qué podría hacer Uli con su descubrimiento?",options:["Decir que las flores no importan porque son pequeñas.","Compartir con Issa lo que ha descubierto.","Guardar su descubrimiento porque Issa es más alta."],ref:[
["Aunque sean pequeñas, las flores pueden ser muy importantes para Uli.","Uli puede mostrarle a Issa algo hermoso que ella no había visto.","Uli también tiene algo valioso que contar. Su tamaño no hace menos importante su descubrimiento."],
["El tamaño de algo no determina cuánto puede significar para una persona.","Compartir lo que observamos permite que otras personas conozcan nuestra perspectiva.","La altura de Issa no hace que los descubrimientos de Uli tengan menos valor."],
["Descalificar un descubrimiento por parecer pequeño puede impedirnos reconocer lo que otra persona aprecia.","Expresar nuestra perspectiva y escuchar otras permite compartir experiencias sin competir por quién tiene razón.","Sentirse menos importante por una diferencia física puede llevar a silenciar ideas valiosas. Todas las personas merecen ser escuchadas."]]},
{image:"El_Mirador_Momento_4_personajes_mas_grandes.png",dialogue:[["Issa","Yo descubrí los caminos que unen las islas."],["Uli","Y yo encontré un pequeño hilo entre las flores."],["Issa","¡Qué bonito que podamos contarnos lo que vemos!"],["Uli","Aunque no miremos igual."],["Issa","¡Y no tenemos que hacerlo!"]],q:"¿Qué nos enseña el encuentro de Issa y Uli?",options:["Que uno de los dos tenía que aprender a mirar mejor.","Que sus miradas son distintas y ambas merecen respeto.","Que ahora siempre tendrán que estar de acuerdo."],ref:[
["Ninguno tiene que mirar igual que el otro. ¡Los dos pueden ser como son!","¡Sí! Issa y Uli ven cosas diferentes y pueden quererse y respetarse.","Pueden ser amigos aunque no siempre piensen igual."],
["Ninguno necesita cambiar su perspectiva para merecer respeto.","Las diferencias pueden compartirse y comprenderse sin que una persona sea superior a otra.","Respetarse no significa estar de acuerdo en todo. Significa tratarse bien incluso cuando pensamos distinto."],
["La convivencia no exige que todas las personas adopten una misma perspectiva.","El respeto reconoce la dignidad de cada persona, incluso cuando sus experiencias y opiniones son diferentes.","El desacuerdo no justifica el rechazo, la burla ni la exclusión. Podemos convivir sin uniformidad."]]}
];
const closing=[
["Todos somos diferentes. A algunos nos gustan unas cosas y a otros, otras. Nadie merece que se burlen de él o lo dejen por fuera por ser diferente.","¿Qué puedes hacer si ves que no dejan jugar a alguien?","Invitarlo a participar, si quiere. Tratarlo con respeto y pedir ayuda a una persona adulta si lo están lastimando."],
["No todos vemos, sentimos o pensamos igual. Eso no hace que alguien sea mejor o peor. Cuando nos burlamos, rechazamos o dejamos por fuera a alguien por ser diferente, podemos hacerle daño. Respetar también significa escuchar, incluir y buscar ayuda cuando alguien es maltratado.","¿Qué harías si tus compañeros se burlaran de alguien por ser diferente?","No participar en las burlas, acompañar a quien está siendo excluido si es seguro hacerlo y buscar ayuda de una persona adulta de confianza."],
["Las diferencias forman parte de nuestra identidad. No necesitamos compartir todas las opiniones, intereses o capacidades para reconocernos como personas igualmente valiosas. Cuando una diferencia se utiliza para humillar, aislar o maltratar repetidamente a alguien, puede convertirse en una situación de bullying.","¿Cómo puedes ayudar cuando alguien es excluido o maltratado por ser diferente?","No reforzar las burlas, ofrecer apoyo respetando lo que la persona necesita y buscar ayuda de una persona adulta de confianza."]
];
let age=1,step=0,selected=[null,null,null,null],showClosing=false;const app=document.getElementById("app");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function revealIfNeeded(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const target=document.querySelector(".reflection")||document.querySelector(".question");if(!target)return;const r=target.getBoundingClientRect();const safeTop=20,safeBottom=window.innerHeight-80;let delta=0;if(r.height>safeBottom-safeTop){delta=r.top-safeTop}else if(r.bottom>safeBottom){delta=r.bottom-safeBottom}else if(r.top<safeTop){delta=r.top-safeTop}if(Math.abs(delta)>4)window.scrollBy({top:delta,behavior:"smooth"})}))}
const headings=[["Descubrir otras miradas","Lo que tú ves, lo que yo veo"],["Escuchar otras perspectivas","Compartir nuestra mirada"],["Valorar las diferencias","Un descubrimiento para compartir"],["Aprender a encontrarnos","Cada mirada cuenta"]];function render(){document.getElementById("pedagogicalHeading").textContent=showClosing?"Para llevar contigo":headings[step][0];document.getElementById("narrativeHeading").textContent=showClosing?"El hilo que nos une":headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===(showClosing?4:step)?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(showClosing?5:step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(showClosing){app.innerHTML='<section class="panel closing-panel"><svg class="union-knot" viewBox="0 0 820 84" role="img" aria-label="Dos hilos dorados unidos en un nudo central" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke-linecap="round"><path d="M-10 42 C100 42 180 20 290 39 C350 49 379 67 415 46 C444 29 411 8 388 24 C360 44 401 68 437 54 L456 46" stroke="#a96e15" stroke-width="9"/><path d="M-10 42 C100 42 180 20 290 39 C350 49 379 67 415 46 C444 29 411 8 388 24 C360 44 401 68 437 54 L456 46" stroke="#e5ac36" stroke-width="7"/><path d="M-10 42 C100 42 180 20 290 39 C350 49 379 67 415 46 C444 29 411 8 388 24 C360 44 401 68 437 54 L456 46" stroke="#f8d67a" stroke-width="2.2" stroke-dasharray="2 3"/><path d="M-10 42 C100 42 180 20 290 39 C350 49 379 67 415 46 C444 29 411 8 388 24 C360 44 401 68 437 54 L456 46" stroke="#ffe7a0" stroke-width="1" transform="translate(0 -2)"/></g><g fill="none" stroke-linecap="round"><path d="M830 42 C720 42 640 64 530 45 C470 35 441 17 405 38 C376 55 409 76 432 60 C460 40 419 16 383 30 L364 38" stroke="#a96e15" stroke-width="9"/><path d="M830 42 C720 42 640 64 530 45 C470 35 441 17 405 38 C376 55 409 76 432 60 C460 40 419 16 383 30 L364 38" stroke="#e5ac36" stroke-width="7"/><path d="M830 42 C720 42 640 64 530 45 C470 35 441 17 405 38 C376 55 409 76 432 60 C460 40 419 16 383 30 L364 38" stroke="#f8d67a" stroke-width="2.2" stroke-dasharray="2 3"/><path d="M830 42 C720 42 640 64 530 45 C470 35 441 17 405 38 C376 55 409 76 432 60 C460 40 419 16 383 30 L364 38" stroke="#ffe7a0" stroke-width="1" transform="translate(0 -2)"/></g><g fill="none" stroke-linecap="round"><path d="M391 29 C399 36 411 46 421 51" stroke="#a96e15" stroke-width="9"/><path d="M391 29 C399 36 411 46 421 51" stroke="#e5ac36" stroke-width="7"/><path d="M391 29 C399 36 411 46 421 51" stroke="#f8d67a" stroke-width="2.2" stroke-dasharray="2 3"/><path d="M391 29 C399 36 411 46 421 51" stroke="#ffe7a0" stroke-width="1" transform="translate(0 -2)"/></g></svg><p>'+closing[age][0]+'</p><h2>'+closing[age][1]+'</h2><p>'+closing[age][2]+'</p><p><strong>No tenemos que mirar el mundo de la misma manera para compartirlo. Cada mirada merece ser escuchada y respetada.</strong></p><p>Aquel pequeño hilo dorado no terminaba entre las flores. Seguía su camino, cruzaba el cielo y llegaba hasta otra isla.</p><nav class="nav"><button class="next secondary" id="closingBack">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("closingBack").onclick=()=>{showClosing=false;render();window.scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];showClosing=false;render()};return}
const s=scenes[step];let out='<div class="scene '+(step===0?'moment-one':step===1?'moment-two':step===2?'crop moment-three':'crop moment-four')+'"><img src="'+encodeURI(s.image)+'" alt="Ilustración aprobada de El Mirador, momento '+(step+1)+'"></div><section class="panel">';
const twoStates=true;
if(twoStates&&selected[step]!==null){
 out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>';
}else{
 out+='<div class="dialogue">'+s.dialogue.map(d=>'<p><b>'+d[0]+':</b> —'+escapeHtml(d[1])+'</p>').join("")+'</div><div class="question">'+s.q+'</div>';
 out+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'" aria-pressed="'+(selected[step]===i)+'">'+escapeHtml(o)+'</button>').join("")+'</div>';
 if(!twoStates&&selected[step]!==null)out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div>';
}
out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';
app.innerHTML=out;
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();revealIfNeeded()});
const change=document.getElementById("change");if(change)change.onclick=()=>{selected[step]=null;render();revealIfNeeded()};
document.getElementById("back").onclick=()=>{step--;render();window.scrollTo(0,0)};
document.getElementById("forward").onclick=()=>{if(step===3)showClosing=true;else step++;render();window.scrollTo(0,0)};
}
document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{age=+b.dataset.age;render()});render();
</script></body></html>
