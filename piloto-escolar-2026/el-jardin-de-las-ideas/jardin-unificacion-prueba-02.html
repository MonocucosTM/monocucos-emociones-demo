ine-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:38px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style><style>.island-shell:has(.closing-panel) #app{max-width:none;padding:0 0 12px}.closing-panel{max-width:none;padding:4px 0 0}.closing-panel>p,.closing-panel>h2,.closing-panel>nav{max-width:792px;margin-left:auto;margin-right:auto;width:calc(100% - 28px)}.union-knot-wide{width:100%;height:96px;overflow:hidden;display:flex;align-items:center;margin:0 0 14px}.union-knot-wide img{display:block;width:100%;height:auto;flex:none}@media(max-width:700px){.union-knot-wide{height:65px}}</style><style>.scene.garden{aspect-ratio:3/1;background:#e7e1d8}.scene.garden img{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><main class="wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../prueba-seis-islas-v16/mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const scenes=[{"image":"momento-1.png","q":"¿Qué debería hacer Papush al ver que Puma quiere plantar la flor?","options":["Plantarla por Puma para que no tenga dificultades.","Preguntarle a Puma si quiere ayuda.","Dejar que Puma lo intente sin ofrecerle ayuda."],"ref":[["Papush quiere ayudar a Puma, pero Puma tiene muchas ganas de plantar su flor. Si Papush lo hace por él, Puma pierde la oportunidad de intentarlo. ¿Qué podría preguntarle Papush antes de ayudarlo?","Papush puede preguntarle a Puma si quiere ayuda y escuchar su respuesta. Quizá Puma quiera probar primero o necesite que Papush sostenga algo. Así los dos pueden participar sin que Papush decida por él.","Puma puede intentar plantar su flor y Papush puede quedarse cerca. Si Puma necesita ayuda, puede pedirla. ¿Cómo podría Papush acompañarlo sin hacer la tarea por él?"],["Papush tiene buenas intenciones, pero todavía no sabe si Puma necesita ayuda. Hacer algo por otra persona sin preguntarle puede quitarle la oportunidad de aprender y disfrutar de sus propios logros. Podemos ofrecer ayuda sin decidir por los demás.","Preguntar permite conocer qué necesita Puma en lugar de decidir por él. Tal vez quiera plantar la flor solo o compartir una parte de la tarea. Escuchar su respuesta permite ofrecer ayuda sin quitarle la iniciativa.","Respetar que Puma quiera intentarlo no significa que Papush deba alejarse. Puede preguntarle si quiere compañía y estar disponible si surge una dificultad. Acompañar también significa dar tiempo y confianza."],["Cuando suponemos que alguien no puede hacer algo por sus características o capacidades, podemos limitar su participación, incluso si nuestra intención es protegerlo. Respetar su autonomía significa escuchar sus decisiones y ofrecerle el apoyo que realmente necesita.","Preguntar reconoce que Puma tiene derecho a decidir cómo participar. Papush puede tener más experiencia, pero eso no le permite conocer de antemano las preferencias de Puma. Ofrecer apoyo respetando su respuesta fortalece su autonomía.","La autonomía no exige hacerlo todo sin apoyo. Papush puede respetar la iniciativa de Puma y ofrecer ayuda sin imponerla. Una participación inclusiva permite elegir tanto la manera de actuar como los apoyos que se necesitan."]]},{"image":"momento-2.png","q":"¿Qué crees que debería comprender Papush al escuchar a Puma?","options":["Que querer ayudar no significa decidir por Puma.","Que Puma debería aceptar la ayuda porque Papush tiene buenas intenciones.","Que Puma debe hacerlo todo solo para demostrar que puede."],"ref":[["Papush quería ayudar, pero Puma también tenía una idea: plantar su propia flor. Cuando hacemos algo por alguien sin preguntarle, podemos quitarle algo que quería hacer. ¿Cómo crees que se sintió Puma al ver que Papush se adelantaba?","Papush quiere mucho a Puma y desea ayudarlo. Pero Puma también quiere plantar la flor. ¿Crees que Puma tiene que aceptar una ayuda que no pidió? ¿Qué podría decirle a Papush?","Puma quiere intentarlo, pero eso no significa que tenga que hacerlo todo solito. Si necesita ayuda, puede pedirla. ¿Podría Papush acompañarlo sin quitarle la flor?"],["Papush tenía una buena intención, pero no sabía lo que Puma quería. Al adelantarse, casi le quitó la oportunidad de participar. A veces una ayuda puede hacernos sentir que no confían en nosotros. ¿Cómo podría Papush demostrarle a Puma que sí confía en él?","Las buenas intenciones son importantes, pero no significan que la otra persona quiera recibir esa ayuda. Puma puede agradecer que Papush se preocupe y, al mismo tiempo, decir que prefiere intentarlo. ¿Cómo podemos mostrar cariño sin decidir por nuestros amigos?","Puma no necesita demostrar nada para tener derecho a participar. Puede intentarlo por sí mismo, pedir ayuda o cambiar de idea. Lo importante es que pueda elegir. ¿Qué podría hacer Papush si Puma encuentra una dificultad?"],["La intención de Papush era ayudar, pero el resultado podía ser diferente: Puma quedaría fuera de una actividad que él mismo había elegido. Cuando decidimos por otra persona, aunque sea para facilitarle las cosas, podemos limitar su autonomía. ¿Por qué crees que es importante escuchar a alguien antes de decidir qué necesita?","A veces creemos que ayudar siempre será bien recibido, especialmente cuando pensamos que alguien tendrá dificultades. Pero una persona puede valorar nuestra intención y no estar de acuerdo con nuestra decisión. ¿Qué diferencia hay entre ofrecer ayuda y esperar que alguien la acepte obligatoriamente?","A veces pasamos de decidir por alguien a exigirle que demuestre que puede hacerlo sin apoyo. Ambas situaciones pueden ignorar lo que esa persona realmente necesita. La autonomía no consiste en rechazar toda ayuda, sino en poder participar en las decisiones. ¿Cómo podemos acompañar a alguien respetando esa libertad?"]]},{"image":"momento-3.png","q":"¿Qué está intentando explicarle Puma a Papush?","options":["Que quiere tener la oportunidad de decidir cómo participar.","Que ya no quiere recibir ayuda de Papush.","Que Papush debe dejarlo hacer todo sin acompañarlo."],"ref":[["Puma quiere plantar su flor y probar su propia idea. Cuando Papush decide por él, Puma pierde esa oportunidad. ¿Cómo te sentirías si alguien hiciera por ti algo que tenías muchas ganas de intentar?","Puma no ha dicho que nunca quiera ayuda. Quiere que Papush le pregunte primero. A veces queremos intentar algo solos y otras veces necesitamos compañía. ¿Podemos querer las dos cosas?","Puma quiere intentarlo, pero Papush puede quedarse cerca. Acompañar también puede ser mirar, escuchar o esperar. ¿Cómo podría Papush estar con Puma sin hacer la tarea por él?"],["Puma no está diciendo que Papush no pueda ayudarlo. Está explicando que también quiere elegir cómo hacer las cosas. Cuando alguien toma una decisión por nosotros sin escucharnos, podemos sentir que nuestra opinión no importa. ¿Qué podría hacer Papush para demostrarle que su opinión sí cuenta?","Decir que no a una ayuda en un momento no significa rechazar a quien la ofrece. Puma aprecia a Papush, pero quiere participar a su manera. ¿Por qué es importante que podamos decir lo que necesitamos sin preocuparnos de que nuestro amigo se moleste?","Papush no tiene que elegir entre hacerlo todo o alejarse. Puede ofrecer su compañía y respetar la respuesta de Puma. Si aparece una dificultad, pueden pensar juntos qué hacer. ¿Qué diferencia hay entre estar disponible para ayudar y adelantarse sin preguntar?"],["Puma está reclamando algo más importante que plantar una flor: el derecho a participar en una decisión que lo afecta. Aunque Papush tenga más fuerza o experiencia, eso no significa que conozca mejor los deseos de Puma. ¿Qué cambia en una relación cuando dejamos de suponer lo que el otro necesita y empezamos a escucharlo?","Podemos confundir la autonomía con el rechazo a los demás. Pero Puma no está rompiendo el vínculo con Papush: está intentando construir una manera de relacionarse en la que ambos puedan expresar lo que desean. ¿Cómo podemos recibir un «prefiero intentarlo» sin interpretarlo como un rechazo personal?","Respetar la autonomía no significa abandonar a alguien frente a sus dificultades. También implica reconocer que las personas pueden necesitar distintos tipos de apoyo y que esas necesidades pueden cambiar. ¿Cómo podría Papush ofrecer ayuda sin convertir su propia manera de hacer las cosas en la única posible?"]]},{"image":"momento-4.png","q":"¿Qué ha aprendido Papush al acompañar a Puma?","options":["Que acompañar también significa escuchar y respetar las decisiones de los demás.","Que ayudar es hacer las cosas más rápido y evitar que otros se equivoquen.","Que Puma debe hacerlo todo solo para que los demás confíen en él."],"ref":[["Papush descubrió que Puma tenía sus propias ideas. Cuando lo escuchó, pudieron disfrutar juntos de la flor. ¿Cómo te sientes cuando alguien escucha lo que quieres hacer, aunque tenga una idea diferente?","Papush podía plantar la flor más rápido, pero Puma quería aprender e intentarlo. A veces necesitamos tiempo para descubrir cómo hacer algo. ¿Qué cosas te gusta intentar aunque no te salgan a la primera?","Puma pudo plantar su flor, pero eso no significa que siempre tenga que hacerlo solo. También puede pedir ayuda. ¿A quién te gusta pedirle ayuda cuando algo se vuelve difícil?"],["Papush comprendió que ayudar no consiste únicamente en resolver una dificultad. También importa que la otra persona pueda participar y tomar decisiones. ¿Qué habría cambiado si Papush hubiera escuchado a Puma desde el principio?","Cuando Papush hace todo para evitarle dificultades a Puma, también puede impedirle descubrir sus propias maneras de hacer las cosas. Equivocarse no siempre es algo malo. ¿Por qué crees que permitir que alguien lo intente puede ser una forma de confiar en él?","Puma no tiene que demostrar que puede hacerlo todo sin ayuda. Su opinión merece respeto incluso cuando necesita apoyo. ¿Por qué crees que pedir ayuda no nos hace menos capaces de decidir?"],["Papush descubrió que la inclusión no depende solamente de permitir que alguien esté presente, sino de reconocer su voz y su capacidad de decidir. ¿Puede alguien estar incluido en una actividad si los demás toman todas las decisiones por él? ¿Por qué?","La rapidez y la facilidad no siempre son lo más importante. Si buscamos únicamente terminar una tarea, podemos olvidar la experiencia y la participación de quienes la realizan. ¿Cómo decidir cuándo conviene intervenir y cuándo es mejor ofrecer tiempo, confianza o apoyo?","La autonomía no significa independencia absoluta. Todos necesitamos ayuda en distintos momentos, y eso no debería disminuir nuestro derecho a decidir. ¿Qué diferencia existe entre recibir un apoyo que hemos elegido y depender de decisiones que otros toman por nosotros?"]]}];
const DIALOGUES=[
 [
  ['n','Puma ha encontrado un lugar en el jardín donde quiere plantar una flor. Papush lo observa. Es más grande que Puma y piensa que quizá la tarea resulte difícil para su pequeño amigo. Puma, sin embargo, quiere intentarlo.']
 ],
 [
  ['n','Papush mira la flor y piensa que puede ayudar a Puma. Sin preguntarle, se adelanta y está a punto de plantarla.'],
  ['Puma','¡Espera, Papush! ¡Yo quería intentarlo!'],
  ['n','Papush se sorprende.'],
  ['Papush','Pero yo solo quería ayudarte…'],
  ['n','Papush quería hacer algo bueno por su amigo. Sin embargo, no había pensado que Puma también quería participar.']
 ],
 [

  ['n','Papush lo escucha.'],
  ['Papush','Pensé que sería más fácil si lo hacía yo.'],
  ['Puma','Puede ser. Pero quería intentarlo. Y si necesito ayuda, puedo pedírtela.'],
  ['n','Papush comienza a comprender que ayudar no consiste solamente en hacer las cosas más fáciles, sino también en escuchar cómo quiere participar la otra persona.']
 ],
 [

  ['Papush','Ahora entiendo, Puma. Quería ayudarte, pero olvidé preguntarte cómo.'],

  ['n','Los dos contemplan la pequeña flor. Papush descubre que acompañar a alguien no siempre significa hacer las cosas por él. A veces significa escucharlo, confiar en sus decisiones y estar presente cuando necesita ayuda.']
 ]

const closing=[["Todos tenemos derecho a intentar las cosas a nuestra manera. Nadie merece burlas porque necesite ayuda o tarde más en hacer algo.","¿Qué puedes hacer si alguien se burla de un amigo que necesita ayuda?","No reírte de él, preguntarle qué necesita y pedir ayuda a una persona adulta si lo están lastimando."],["Necesitar ayuda no significa que otros puedan decidir por nosotros. Burlarse de las capacidades de alguien o impedirle participar puede hacerle daño.","¿Qué puedes hacer si alguien es rechazado porque necesita ayuda?","No sumarte a las burlas, escuchar cómo quiere participar y buscar ayuda de una persona adulta de confianza."],["Todas las personas tienen derecho a participar y tomar decisiones, incluso cuando necesitan apoyo. Desvalorizar sus capacidades, humillarlas o excluirlas repetidamente puede convertirse en bullying.","¿Cómo puedes ayudar cuando alguien es excluido por sus capacidades?","No reforzar el rechazo, escuchar qué apoyo desea y buscar ayuda de una persona adulta de confianza."]];
let age=1,step=0,selected=[null,null,null,null],showClosing=false;const app=document.getElementById("app");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function revealIfNeeded(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const target=document.querySelector(".reflection")||document.querySelector(".question");if(!target)return;const r=target.getBoundingClientRect();const safeTop=20,safeBottom=window.innerHeight-80;let delta=0;if(r.height>safeBottom-safeTop){delta=r.top-safeTop}else if(r.bottom>safeBottom){delta=r.bottom-safeBottom}else if(r.top<safeTop){delta=r.top-safeTop}if(Math.abs(delta)>4)window.scrollBy({top:delta,behavior:"smooth"})}))}
const headings=[["Reconocer la autonomía","Déjame intentarlo"],["Comprender cómo ayudamos","Yo solo quería ayudar"],["Escuchar antes de actuar","¿Y si me preguntas?"],["Aprender a acompañar","A mi manera, contigo"]];function render(){document.getElementById("pedagogicalHeading").textContent=showClosing?"Para llevar contigo":headings[step][0];document.getElementById("narrativeHeading").textContent=showClosing?"El hilo que nos une":headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===(showClosing?4:step)?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(showClosing?5:step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(showClosing){app.innerHTML='<section class="panel closing-panel"><div class="union-knot-wide"><img src="../revision-menu-tres-experiencias/hilo-que-nos-une.png" alt="Dos hilos dorados unidos en un nudo central"></div><p>'+closing[age][0]+'</p><h2>'+closing[age][1]+'</h2><p>'+closing[age][2]+'</p><p><strong>Acompañar no es decidir por los demás. Es escuchar, confiar y respetar su manera de participar.</strong></p><p>El hilo amarillo siguió su camino desde el jardín hacia otras islas.</p><nav class="nav"><button class="next secondary" id="closingBack">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("closingBack").onclick=()=>{showClosing=false;render();window.scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];showClosing=false;render()};return}
const s=scenes[step];let out='<div class="scene '+'garden'+'"><img src="'+encodeURI(s.image)+'" alt="Ilustración aprobada de El Jardín de las Ideas, momento '+(step+1)+'"></div><section class="panel">';
const twoStates=true;
if(twoStates&&selected[step]!==null){
 out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>';
}else{
 out+='<div class="dialogue">'+DIALOGUES[step].map(d=>d[0]==='n'?'<p>'+escapeHtml(d[1])+'</p>':'<p><b>'+escapeHtml(d[0])+':</b> —'+escapeHtml(d[1])+'</p>').join("")+'</div><div class="question">'+s.q+'</div>';
 out+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'" aria-pressed="'+(selected[step]===i)+'">'+escapeHtml(o)+'</button>').join("")+'</div>';
 if(!twoStates&&selected[step]!==null)out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div>';
}
out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';
app.innerHTML=out;
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();revealIfNeeded()});
const change=document.getElementById("change");if(change)change.onclick=()=>{selected[step]=null;render();revealIfNeeded()};
document.getElementById("back").onclick=()=>{step--;render();window.scrollTo(0,0)};
document.getElementById("forward").onclick=()=>{if(step===3)showClosing=true;else step++;render();window.scrollTo(0,0)};
}
document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{age=+b.dataset.age;render()});render();
</script></body></html>
