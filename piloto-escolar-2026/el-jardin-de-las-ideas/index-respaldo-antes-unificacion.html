:root{font-family:Optima,"Trebuchet MS",sans-serif;color:#273b32;background:#f8f4f0}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b18425;outline-offset:3px}.wrap{max-width:740px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:700}.sub{font-size:13px;color:#556257}.age{display:flex;gap:6px;flex-wrap:wrap}.age button,.next,.choice{border:1px solid #d8c9c0;background:white;border-radius:24px;padding:9px 13px}.age button[aria-pressed=true],.choice[aria-pressed=true]{background:#ffe0a0;border-color:#dba539}.mapreturn{display:block;color:#315740;font-size:13px;margin:8px 0}.scene{position:relative;margin-top:8px;border-radius:24px;overflow:hidden;background:#e7e1d8;aspect-ratio:3/1}.scene img{display:block;width:100%;height:100%;object-fit:contain}.panel{background:#fff;border-radius:18px;padding:14px 16px;margin-top:8px;box-shadow:0 4px 22px #30223c12}.small{font-size:13px;color:#5b5d70;margin:0 0 8px}.dialogue{line-height:1.65;margin:5px 0 12px}.dialogue p{margin:7px 0}.dialogue .speech{margin:7px 0;padding:0;border:0;background:transparent}.dialogue .speaker{font-weight:700;color:inherit}.moment-title{font-size:clamp(19px,2.5vw,24px);font-weight:600;margin:0 0 12px;color:#405e48}.question{font-size:20px;font-weight:700;margin:15px 0 10px}.choices{display:grid;gap:9px}.choice{text-align:left;border-radius:14px}.reflection{margin-top:6px;padding:12px;border-left:4px solid #e5ae37;background:#fff7e8;border-radius:10px;line-height:1.55}.reflection p{margin:8px 0 0}.nav{display:flex;justify-content:space-between;gap:10px;margin:9px 0}.next{background:#f9cb6b;font-weight:700}.next:disabled{opacity:.4;cursor:not-allowed}.thread{height:65px;width:100%}.thread path{fill:none;stroke:#dca526;stroke-width:5;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;animation:weave 4s forwards}@keyframes weave{to{stroke-dashoffset:0}}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.panel{padding:14px}.question{font-size:18px}.wrap{padding:10px}.brand{font-size:19px}}
</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">El Jardín de las Ideas</div><div class="sub">Papush y Puma · MONOCUCOS</div></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></header><a class="mapreturn" href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a><div id="app"></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const TITLES=['Déjame intentarlo','Yo solo quería ayudar','¿Y si me preguntas?','A mi manera, contigo'];
const DATA={"scenes": [{"dialogue": "Puma ha encontrado un lugar en el jardín donde quiere plantar una flor. Papush lo observa. Es más grande que Puma y piensa que quizá la tarea resulte difícil para su pequeño amigo. Puma, sin embargo, quiere intentarlo.", "q": "¿Qué debería hacer Papush al ver que Puma quiere plantar la flor?", "options": ["Plantarla por Puma para que no tenga dificultades.", "Preguntarle a Puma si quiere ayuda.", "Dejar que Puma lo intente sin ofrecerle ayuda."], "ref": [["Papush quiere ayudar, pero Puma también quiere participar. ¿Qué podría preguntarle antes de actuar?", "Aunque Papush tenga buenas intenciones, hacer la tarea por Puma le quitaría la oportunidad de intentarlo. ¿Cómo podría ofrecerle ayuda?", "Cuando suponemos que alguien no podrá hacer algo, podemos limitar su participación sin darnos cuenta. ¿Qué debería averiguar Papush antes de decidir?"], ["Papush puede preguntarle y escuchar lo que Puma quiere hacer. Así Puma sabe que su idea también importa. ¿Cómo te gusta que te pregunten si necesitas ayuda?", "Preguntar permite conocer qué necesita Puma, en lugar de decidir por él. Así puede ofrecerle ayuda sin quitarle la iniciativa.", "Papush reconoce que no le corresponde decidir por Puma. Preguntar es una forma de respetar su autonomía y su derecho a participar."], ["Puma puede intentarlo, pero también puede necesitar compañía. ¿Cómo podría Papush estar cerca?", "Respetar que Puma quiera intentarlo no significa que Papush deba alejarse. Puede acompañarlo y estar disponible si Puma lo necesita.", "La autonomía no exige hacerlo todo sin apoyo. Papush puede respetar la iniciativa de Puma y, al mismo tiempo, ofrecer ayuda sin imponerla."]]}, {"dialogue": "Papush mira la flor y piensa que puede ayudar a Puma. Sin preguntarle, se adelanta y está a punto de plantarla. —¡Espera, Papush! —dice Puma—. ¡Yo quería intentarlo! Papush se sorprende. —Pero yo solo quería ayudarte… Papush quería hacer algo bueno por su amigo. Sin embargo, no había pensado que Puma también quería participar.", "q": "¿Qué crees que debería comprender Papush al escuchar a Puma?", "options": ["Que querer ayudar no significa decidir por Puma.", "Que Puma debería aceptar la ayuda porque Papush tiene buenas intenciones.", "Que Puma debe hacerlo todo solo para demostrar que puede."], "ref": [["Papush quería ayudar, pero Puma también tenía una idea: plantar su propia flor. Cuando hacemos algo por alguien sin preguntarle, podemos quitarle algo que quería hacer. ¿Cómo crees que se sintió Puma al ver que Papush se adelantaba?", "Papush tenía una buena intención, pero no sabía lo que Puma quería. Al adelantarse, casi le quitó la oportunidad de participar. A veces una ayuda puede hacernos sentir que no confían en nosotros. ¿Cómo podría Papush demostrarle a Puma que sí confía en él?", "La intención de Papush era ayudar, pero el resultado podía ser diferente: Puma quedaría fuera de una actividad que él mismo había elegido. Cuando decidimos por otra persona, aunque sea para facilitarle las cosas, podemos limitar su autonomía. ¿Por qué crees que es importante escuchar a alguien antes de decidir qué necesita?"], ["Papush quiere mucho a Puma y desea ayudarlo. Pero Puma también quiere plantar la flor. ¿Crees que Puma tiene que aceptar una ayuda que no pidió? ¿Qué podría decirle a Papush?", "Las buenas intenciones son importantes, pero no significan que la otra persona quiera recibir esa ayuda. Puma puede agradecer que Papush se preocupe y, al mismo tiempo, decir que prefiere intentarlo. ¿Cómo podemos mostrar cariño sin decidir por nuestros amigos?", "A veces creemos que ayudar siempre será bien recibido, especialmente cuando pensamos que alguien tendrá dificultades. Pero una persona puede valorar nuestra intención y no estar de acuerdo con nuestra decisión. ¿Qué diferencia hay entre ofrecer ayuda y esperar que alguien la acepte obligatoriamente?"], ["Puma quiere intentarlo, pero eso no significa que tenga que hacerlo todo solito. Si necesita ayuda, puede pedirla. ¿Podría Papush acompañarlo sin quitarle la flor?", "Puma no necesita demostrar nada para tener derecho a participar. Puede intentarlo por sí mismo, pedir ayuda o cambiar de idea. Lo importante es que pueda elegir. ¿Qué podría hacer Papush si Puma encuentra una dificultad?", "A veces pasamos de decidir por alguien a exigirle que demuestre que puede hacerlo sin apoyo. Ambas situaciones pueden ignorar lo que esa persona realmente necesita. La autonomía no consiste en rechazar toda ayuda, sino en poder participar en las decisiones. ¿Cómo podemos acompañar a alguien respetando esa libertad?"]]}, {"dialogue": "Puma mira a Papush y le dice: —Sé que querías ayudarme, Papush. Pero yo también tenía una idea de cómo plantar mi flor. Papush lo escucha. —Pensé que sería más fácil si lo hacía yo —responde. —Puede ser —dice Puma—. Pero quería intentarlo. Y si necesito ayuda, puedo pedírtela. Papush comienza a comprender que ayudar no consiste solamente en hacer las cosas más fáciles, sino también en escuchar cómo quiere participar la otra persona.", "q": "¿Qué está intentando explicarle Puma a Papush?", "options": ["Que quiere tener la oportunidad de decidir cómo participar.", "Que ya no quiere recibir ayuda de Papush.", "Que Papush debe dejarlo hacer todo sin acompañarlo."], "ref": [["Puma quiere plantar su flor y probar su propia idea. Cuando Papush decide por él, Puma pierde esa oportunidad. ¿Cómo te sentirías si alguien hiciera por ti algo que tenías muchas ganas de intentar?", "Puma no está diciendo que Papush no pueda ayudarlo. Está explicando que también quiere elegir cómo hacer las cosas. Cuando alguien toma una decisión por nosotros sin escucharnos, podemos sentir que nuestra opinión no importa. ¿Qué podría hacer Papush para demostrarle que su opinión sí cuenta?", "Puma está reclamando algo más importante que plantar una flor: el derecho a participar en una decisión que lo afecta. Aunque Papush tenga más fuerza o experiencia, eso no significa que conozca mejor los deseos de Puma. ¿Qué cambia en una relación cuando dejamos de suponer lo que el otro necesita y empezamos a escucharlo?"], ["Puma no ha dicho que nunca quiera ayuda. Quiere que Papush le pregunte primero. A veces queremos intentar algo solos y otras veces necesitamos compañía. ¿Podemos querer las dos cosas?", "Decir que no a una ayuda en un momento no significa rechazar a quien la ofrece. Puma aprecia a Papush, pero quiere participar a su manera. ¿Por qué es importante que podamos decir lo que necesitamos sin preocuparnos de que nuestro amigo se moleste?", "Podemos confundir la autonomía con el rechazo a los demás. Pero Puma no está rompiendo el vínculo con Papush: está intentando construir una manera de relacionarse en la que ambos puedan expresar lo que desean. ¿Cómo podemos recibir un «prefiero intentarlo» sin interpretarlo como un rechazo personal?"], ["Puma quiere intentarlo, pero Papush puede quedarse cerca. Acompañar también puede ser mirar, escuchar o esperar. ¿Cómo podría Papush estar con Puma sin hacer la tarea por él?", "Papush no tiene que elegir entre hacerlo todo o alejarse. Puede ofrecer su compañía y respetar la respuesta de Puma. Si aparece una dificultad, pueden pensar juntos qué hacer. ¿Qué diferencia hay entre estar disponible para ayudar y adelantarse sin preguntar?", "Respetar la autonomía no significa abandonar a alguien frente a sus dificultades. También implica reconocer que las personas pueden necesitar distintos tipos de apoyo y que esas necesidades pueden cambiar. ¿Cómo podría Papush ofrecer ayuda sin convertir su propia manera de hacer las cosas en la única posible?"]]}, {"dialogue": "Papush observa la flor que Puma ha conseguido plantar. —Ahora entiendo, Puma —le dice—. Quería ayudarte, pero olvidé preguntarte cómo. Puma mira su flor y sonríe. —Me gusta que estés conmigo, Papush. Y también me gusta poder intentarlo a mi manera. —La próxima vez te preguntaré primero —responde Papush. Los dos contemplan la pequeña flor. Papush descubre que acompañar a alguien no siempre significa hacer las cosas por él. A veces significa escucharlo, confiar en sus decisiones y estar presente cuando necesita ayuda.", "q": "¿Qué ha aprendido Papush al acompañar a Puma?", "options": ["Que acompañar también significa escuchar y respetar las decisiones de los demás.", "Que ayudar es hacer las cosas más rápido y evitar que otros se equivoquen.", "Que Puma debe hacerlo todo solo para que los demás confíen en él."], "ref": [["Papush descubrió que Puma tenía sus propias ideas. Cuando lo escuchó, pudieron disfrutar juntos de la flor. ¿Cómo te sientes cuando alguien escucha lo que quieres hacer, aunque tenga una idea diferente?", "Papush comprendió que ayudar no consiste únicamente en resolver una dificultad. También importa que la otra persona pueda participar y tomar decisiones. ¿Qué habría cambiado si Papush hubiera escuchado a Puma desde el principio?", "Papush descubrió que la inclusión no depende solamente de permitir que alguien esté presente, sino de reconocer su voz y su capacidad de decidir. ¿Puede alguien estar incluido en una actividad si los demás toman todas las decisiones por él? ¿Por qué?"], ["Papush podía plantar la flor más rápido, pero Puma quería aprender e intentarlo. A veces necesitamos tiempo para descubrir cómo hacer algo. ¿Qué cosas te gusta intentar aunque no te salgan a la primera?", "Cuando Papush hace todo para evitarle dificultades a Puma, también puede impedirle descubrir sus propias maneras de hacer las cosas. Equivocarse no siempre es algo malo. ¿Por qué crees que permitir que alguien lo intente puede ser una forma de confiar en él?", "La rapidez y la facilidad no siempre son lo más importante. Si buscamos únicamente terminar una tarea, podemos olvidar la experiencia y la participación de quienes la realizan. ¿Cómo decidir cuándo conviene intervenir y cuándo es mejor ofrecer tiempo, confianza o apoyo?"], ["Puma pudo plantar su flor, pero eso no significa que siempre tenga que hacerlo solo. También puede pedir ayuda. ¿A quién te gusta pedirle ayuda cuando algo se vuelve difícil?", "Puma no tiene que demostrar que puede hacerlo todo sin ayuda. Su opinión merece respeto incluso cuando necesita apoyo. ¿Por qué crees que pedir ayuda no nos hace menos capaces de decidir?", "La autonomía no significa independencia absoluta. Todos necesitamos ayuda en distintos momentos, y eso no debería disminuir nuestro derecho a decidir. ¿Qué diferencia existe entre recibir un apoyo que hemos elegido y depender de decisiones que otros toman por nosotros?"]]}], "closing": {"intro": "Papush quería ayudar a Puma porque lo apreciaba. Pero descubrió que, antes de ayudar, necesitaba escuchar. Puma, por su parte, pudo expresar lo que quería y encontrar su propia manera de participar, sabiendo que podía contar con Papush cuando lo necesitara. La flor que plantaron nos recuerda algo importante: todos tenemos derecho a participar, a expresar nuestras ideas y a decidir cómo queremos hacer las cosas, incluso cuando necesitamos ayuda. Porque incluir no es hacer todo por los demás. Es reconocer que cada persona tiene una voz que merece ser escuchada.", "q": "Imagina que alguien quiere participar en una actividad, pero tú piensas que le resultará difícil. ¿Cómo podrías ayudar sin decidir por esa persona?", "options": ["Hacerlo por esa persona para que no se le dificulte.", "Preguntarle cómo quiere participar y qué ayuda necesita.", "Dejar que lo intente sin acercarte, porque debe aprender a hacerlo solo."], "ref": [["Quizá quieras ayudar para que tu amigo no se sienta triste o se canse. Pero imagina que tenía muchas ganas de intentarlo. ¿Cómo se sentiría si no lo dejaras probar? Puedes preguntarle qué quiere hacer y acompañarlo.", "A veces, por cariño, intentamos evitarles las dificultades a los demás. Sin embargo, al hacerlo todo por ellos podemos quitarles una experiencia que deseaban vivir. ¿Cómo podrías saber si tu ayuda realmente les sirve o si necesitan algo diferente?", "Cuando decidimos que una tarea será demasiado difícil para alguien, podemos estar juzgando sus posibilidades sin conocerlas. Incluso una intención protectora puede convertirse en una barrera para participar. ¿Cómo distinguir entre ofrecer un apoyo necesario y limitar a alguien por nuestras propias suposiciones?"], ["Puedes decirle: «¿Quieres que te ayude?». Tal vez quiera probar primero, o tal vez necesite que hagas algo con él. Lo importante es escucharlo. ¿Qué te gustaría que te preguntaran cuando tú quieres intentar algo nuevo?", "Preguntar abre la posibilidad de encontrar juntos distintas maneras de participar. La otra persona puede querer intentarlo, pedir apoyo o proponer una solución que no habías imaginado. ¿Por qué crees que escuchar su respuesta puede ser más útil que ofrecer inmediatamente nuestra propia solución?", "Preguntar no es solamente un gesto amable: significa reconocer a la otra persona como alguien capaz de expresar preferencias y participar en decisiones que la afectan. ¿Cómo cambiarían nuestras actividades en grupo si, antes de decidir quién puede hacer qué, escucháramos las ideas y necesidades de todos?"], ["Intentar algo por nuestra cuenta puede ser divertido, pero a veces también necesitamos ayuda. Puedes estar cerca y preguntar si quiere compañía. ¿Recuerdas alguna vez en que te gustó que alguien estuviera contigo mientras aprendías algo?", "Respetar la decisión de alguien no significa dejarlo sin apoyo. A veces lo que necesita es tiempo; otras veces, una explicación, una mano o simplemente compañía. ¿Cómo podrías ofrecer tu ayuda sin hacer sentir a esa persona que debe aceptarla?", "La autonomía no consiste en tener que resolverlo todo individualmente. Una participación verdaderamente inclusiva permite elegir entre distintas formas de apoyo, sin imponerlas ni retirarlas como castigo por querer decidir. ¿Cómo podemos construir un grupo en el que pedir ayuda y tomar decisiones sean derechos compatibles?"]]}};let age=1,step=0,selected=[null,null,null,null,null];const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function reveal(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=document.querySelector('.reflection')||document.querySelector('.question');if(!t)return;const r=t.getBoundingClientRect(),bottom=innerHeight-65;if(r.bottom>bottom)scrollBy({top:r.bottom-bottom,behavior:'smooth'});else if(r.top<10)scrollBy({top:r.top-10,behavior:'smooth'})}))}

function dialogueMarkup(step){return DIALOGUES[step].map(([speaker,words])=>speaker==='n'?'<p>'+esc(words)+'</p>':'<p class="speech"><b class="speaker">'+esc(speaker)+':</b> —'+esc(words)+'</p>').join('')}
function render(){document.querySelectorAll('[data-age]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.age===age)));const end=step===4,s=end?DATA.closing:DATA.scenes[step];let out='';if(!end)out+='<div class="scene"><img src="momento-'+(step+1)+'.png" alt="Composición aprobada del momento '+(step+1)+'"></div>';out+='<section class="panel"><p class="small">'+(end?'Cierre':'Momento '+(step+1)+' de 4')+'</p><h2 class="moment-title">'+(end?'El hilo que nos une':TITLES[step])+'</h2>';if(selected[step]===null){out+='<div class="dialogue">'+(end?esc(s.intro):dialogueMarkup(step))+'</div><div class="question">'+esc(s.q)+'</div><div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'">'+esc(o)+'</button>').join('')+'</div><p class="small" style="margin-top:12px">* Elige una opción para continuar</p>'}else{out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+esc(s.ref[selected[step]][age])+'</p></div><button class="choice" id="change" style="width:100%;text-align:center;margin-top:10px">Elegir otra respuesta</button>';if(end)out+='<p style="text-align:center;line-height:1.55"><strong>Cuando escuchamos a los demás y respetamos sus decisiones, ayudamos a construir un mundo donde todos tienen un lugar.</strong></p><svg class="thread" viewBox="0 0 600 65" aria-label="Hilo dorado"><path d="M5 34 C90 -10 120 80 220 32 S350 0 420 36 S520 65 595 20"/></svg>'}out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(end?'Volver a empezar':step===3?'Descubrir el hilo':'Continuar')+'</button></nav>';app.innerHTML=out;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();reveal()});const change=document.getElementById('change');if(change)change.onclick=()=>{selected[step]=null;render();reveal()};document.getElementById('back').onclick=()=>{if(step>0){step--;render();scrollTo(0,0)}};document.getElementById('forward').onclick=()=>{if(selected[step]===null)return;if(end){step=0;selected=[null,null,null,null,null]}else step++;render();scrollTo(0,0)}}document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{age=+b.dataset.age;render()});render();
</script></body></html>
