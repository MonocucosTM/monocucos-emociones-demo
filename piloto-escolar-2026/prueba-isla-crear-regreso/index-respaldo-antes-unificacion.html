<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOCUCOS · Un espacio para crear · Recorrido de prueba</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f8f6ef}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.back{position:fixed;z-index:20;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid #c9ad76;border-radius:28px;padding:10px 15px;background:rgba(255,253,244,.96);color:#304638;text-decoration:none;font:600 14px system-ui,-apple-system,sans-serif;box-shadow:0 2px 12px #0002}.back:focus-visible{outline:3px solid #b78a24;outline-offset:3px}@media(max-width:600px){.back{top:8px;left:8px;padding:8px 12px;font-size:12px}}</style><style id="mc-legal-footer-style">.mc-legal-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px/1.4 Optima,"Trebuchet MS",Arial,sans-serif;color:#65766d;padding:5px 0;margin:0;text-align:left}.mc-legal-footer span:last-child{text-align:right}.mc-legal-footer span:nth-child(2){text-align:center}@media(max-width:650px){.mc-legal-footer{grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10px}.mc-legal-footer span:nth-child(2){grid-row:2;grid-column:1/-1}.mc-legal-footer span:last-child{grid-column:2;grid-row:1}}.wrap{padding-bottom:0}.mc-legal-footer{min-height:24px}.mc-legal-footer{width:min(calc(100% - 32px),1132px);margin:auto}body>iframe{height:calc(100dvh - 26px)}</style></head><body><iframe title="Un espacio para crear · Ali y Luna" src="../un-espacio-para-crear/" allowfullscreen></iframe><script>
const frame=document.querySelector('iframe');
frame.addEventListener('load',()=>{
 try{
  const d=frame.contentDocument;
  if(!d || !d.getElementById('next'))return;
  const header=d.querySelector('header.top');
  if(header&&!d.getElementById('returnIslands')){
   const a=d.createElement('a');a.id='returnIslands';a.href='../prueba-seis-islas-v16/mapa/';
   a.textContent='← Volver al mapa de las islas';
   a.style.cssText='display:block;margin:0 0 14px;color:#315740;text-decoration:underline;text-underline-offset:3px;font:15px Optima,Palatino,serif';
   header.insertAdjacentElement('afterend',a);
  }
  const next=d.getElementById('next'),dots=d.getElementById('dots');
  const sync=()=>{
   const active=[...dots.querySelectorAll('.dot')].findIndex(b=>b.classList.contains('on'));
   const desired=active===3?'Descubrir el hilo →':active===4?'Volver a empezar':'Siguiente momento →';
   if(next.textContent!==desired)next.textContent=desired;
  };
  new MutationObserver(sync).observe(dots,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  sync();
 }catch(e){console.warn('No se pudo integrar la navegación',e)}
});
</script><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></body></html>
