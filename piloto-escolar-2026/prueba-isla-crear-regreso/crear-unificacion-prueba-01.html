ine-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:38px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style><style>.island-shell:has(.closing-panel) #app{max-width:none;padding:0 0 12px}.closing-panel{max-width:none;padding:4px 0 0}.closing-panel>p,.closing-panel>h2,.closing-panel>nav{max-width:792px;margin-left:auto;margin-right:auto;width:calc(100% - 28px)}.union-knot-wide{width:100%;height:96px;overflow:hidden;display:flex;align-items:center;margin:0 0 14px}.union-knot-wide img{display:block;width:100%;height:auto;flex:none}@media(max-width:700px){.union-knot-wide{height:65px}}</style><style>.scene.garden{aspect-ratio:3/1;background:#e7e1d8}.scene.garden img{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><main class="wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../prueba-seis-islas-v16/mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><script>
const scenes=[];async function init(){const response=await fetch('../un-espacio-para-crear/index.html');if(!response.ok)throw Error('No se pudo cargar la versión original');const source=await response.text();const imageMatch=source.match(/const images=(\[[\s\S]*?\]);const questions=/);const questionMatch=source.match(/const questions=(\[[\s\S]*?\]);let moment=/);if(!imageMatch||!questionMatch)throw Error('No se encontró el contenido aprobado');const images=JSON.parse(imageMatch[1]),questions=JSON.parse(questionMatch[1]);if(images.length!==4||questions.length!==4)throw Error('Contenido incompleto');questions.forEach((q,i)=>scenes.push({image:images[i],q:q[0],options:q[1].map(o=>o[0]),ref:[0,1,2].map(a=>q[1].map(o=>o[1][a]))}));render()};
let age=0,step=0,selected=[null,null,null,null],showClosing=false;const app=document.getElementById("app");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function revealIfNeeded(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const target=document.querySelector(".reflection")||document.querySelector(".question");if(!target)return;const r=target.getBoundingClientRect();const safeTop=20,safeBottom=window.innerHeight-80;let delta=0;if(r.height>safeBottom-safeTop){delta=r.top-safeTop}else if(r.bottom>safeBottom){delta=r.bottom-safeBottom}else if(r.top<safeTop){delta=r.top-safeTop}if(Math.abs(delta)>4)window.scrollBy({top:delta,behavior:"smooth"})}))}
const headings=[["Expresar lo que queremos","Un espacio para crear"],["Buscar nuevas posibilidades","Otra manera de pintar"],["Valorar las diferencias","Las gotas de Luna"],["Crear juntos","Un corazón compartido"]];function render(){document.getElementById("pedagogicalHeading").textContent=showClosing?"Para llevar contigo":headings[step][0];document.getElementById("narrativeHeading").textContent=showClosing?"El hilo que nos une":headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===(showClosing?4:step)?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(showClosing?5:step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(showClosing){app.innerHTML='<section class="panel closing-panel"><div class="union-knot-wide"><img src="../revision-menu-tres-experiencias/hilo-que-nos-une.png" alt="Dos hilos dorados unidos en un nudo central"></div><p>Cuando alguien quiere participar y encuentra una dificultad, podemos buscar juntos la manera de incluirlo.</p><p>Ali y Luna encontraron una manera de crear juntas, sin tener que pintar de la misma forma. En nuestra clase, en un juego o con nuestros amigos también podemos escuchar, preguntar y descubrir nuevas maneras de compartir.</p><h2>Para conversar</h2><p>¿Qué podríamos hacer si alguien quiere participar en un juego y encuentra una dificultad?</p><nav class="nav"><button class="next secondary" id="closingBack">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("closingBack").onclick=()=>{showClosing=false;render();window.scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];showClosing=false;render()};return}
const s=scenes[step];let out='<div class="scene '+'garden'+'"><img src="'+s.image+'" alt="Ilustración aprobada de Ali y Luna, momento '+(step+1)+'"></div><section class="panel">';
const twoStates=true;
if(twoStates&&selected[step]!==null){
 out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>';
}else{
 out+='<div class="question">'+escapeHtml(s.q)+'</div>';
 out+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-pick="'+i+'" aria-pressed="'+(selected[step]===i)+'">'+escapeHtml(o)+'</button>').join("")+'</div>';
 if(!twoStates&&selected[step]!==null)out+='<div class="reflection"><strong>Para pensar juntos</strong><p>'+escapeHtml(s.ref[age][selected[step]])+'</p></div>';
}
out+='</section><nav class="nav"><button class="next" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(selected[step]===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';
app.innerHTML=out;
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();revealIfNeeded()});
const change=document.getElementById("change");if(change)change.onclick=()=>{selected[step]=null;render();revealIfNeeded()};
document.getElementById("back").onclick=()=>{step--;render();window.scrollTo(0,0)};
document.getElementById("forward").onclick=()=>{if(step===3)showClosing=true;else step++;render();window.scrollTo(0,0)};
}
document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{age=+b.dataset.age;render()});init().catch(e=>{app.textContent=e.message});
</script></body></html>
