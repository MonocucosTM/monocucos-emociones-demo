ine-height:1.45}.question{font-size:19px;margin:12px 0 9px}.choice{font-size:16px;padding:10px 15px;border-color:#d8dfd5;color:#283e38}.reflection{background:#edf3e8;border-left-color:#81aa88;font-size:17px}.next{background:#4b806b;border-color:#4b806b;color:white;padding:10px 19px;font-size:15px}.next.secondary,#back{background:transparent;color:#436e5a;border-color:#d8dfd5}.nav{margin:12px 0 0}.mc-legal-footer{min-height:24px}@media(max-width:700px){.island-heading{flex-wrap:wrap}.top{padding:6px 18px;min-height:62px}.brand-logo{width:112px}.narrative-title{font-size:25px}.island-heading h1{font-size:24px}}</style><style>.island-heading{align-items:flex-start;padding:20px 5.5% 0}.moment-heading{flex:1;min-width:0}.moment-heading .eyebrow{margin:0 0 8px}.moment-heading h1{font-size:44px;line-height:1.16;font-weight:400;margin:0}.island-heading .age{flex-shrink:0;padding-top:5px}@media(max-width:700px){.moment-heading{flex-basis:100%}.moment-heading h1{font-size:32px}}</style><style id="moment-three-panorama">.scene.moment-three{aspect-ratio:1566/455;height:auto}.scene.moment-three img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;object-position:center 20%}</style><style>.union-knot{display:block;width:100%;height:auto;margin:0 0 14px;overflow:hidden}.closing-panel{padding-top:4px}</style><style>.island-shell:has(.closing-panel) #app{max-width:none;padding:0 0 12px}.closing-panel{max-width:none;padding:4px 0 0}.closing-panel>p,.closing-panel>h2,.closing-panel>nav{max-width:792px;margin-left:auto;margin-right:auto;width:calc(100% - 28px)}.union-knot-wide{width:100%;height:96px;overflow:hidden;display:flex;align-items:center;margin:0 0 14px}.union-knot-wide img{display:block;width:100%;height:auto;flex:none}@media(max-width:700px){.union-knot-wide{height:65px}}</style></head><body><main class="wrap"><div class="island-return"><a href="../prueba-seis-islas-v16/mapa/">← Volver al mapa de las islas</a></div><div class="island-shell"><header class="top"><img class="brand-logo" src="../revision-menu-tres-experiencias/assets/da1aea32575e27ba.png" alt="MONOCUCOS"><div class="moment-dots" id="momentDots" aria-label="Progreso"></div></header><div class="island-heading"><div class="moment-heading"><div class="eyebrow" id="pedagogicalHeading"></div><h1 id="narrativeHeading"></h1></div><div class="age" aria-label="Edad"><button data-age="0">4–5 años</button><button data-age="1">6–8 años</button><button data-age="2">9–10 años</button></div></div><div id="map-return" style="display:none;margin:10px 0"><a href="../prueba-seis-islas-v16/mapa/" style="color:#315740">← Volver al mapa de las islas</a></div><div id="app"></div></div><footer class="mc-legal-footer" aria-label="Aviso de derechos de autor"><strong>MONOCUCOS™</strong><span>Un mundo para todos, donde todos somos uno.</span><span>© 2026 · Todos los derechos reservados.</span></footer></main><style>.scene.water img{width:100%;height:auto;display:block;object-fit:contain}.scene.water{background:transparent}.dialogue .intro{margin-bottom:10px}.dialogue-controls{margin:8px 0}.closing-panel>p{line-height:1.55;font-size:18px}</style><script>
const headings=[["Conocer antes de juzgar","La primera impresión"],["Reconocer las capacidades","El trato diferente"],["Construir oportunidades","Las oportunidades"],["Reconocer nuestra igualdad","El valor de una persona"],["Para llevar contigo","El hilo que nos une"]];
const closing=[
["Rowen y Ali se mueven de maneras diferentes. Ninguno vale menos por eso. Todos merecemos jugar, aprender y participar sin que se burlen de nosotros.","¿Qué puedes hacer si dejan a alguien por fuera porque necesita algo diferente?","Preguntarle si quiere participar, escuchar lo que necesita y pedir ayuda a una persona adulta si lo están lastimando."],
["Necesitar una herramienta, apoyo o una manera diferente de hacer las cosas no nos hace menos capaces ni menos valiosos. Las burlas y la exclusión pueden impedir que alguien participe.","¿Qué puedes hacer si alguien es rechazado por ser diferente?","No participar en las burlas, escuchar a esa persona y buscar ayuda de una persona adulta de confianza."],
["Las diferencias de capacidades y necesidades no justifican un trato desigual. Los prejuicios y las barreras pueden limitar la participación; las burlas o la exclusión repetidas pueden convertirse en bullying.","¿Cómo puedes ayudar cuando alguien es excluido por sus diferencias?","No reforzar el rechazo, escuchar qué apoyo necesita la persona y buscar ayuda de una persona adulta de confianza."]
];
const revised=[[["Rowen puede nadar, pero para recorrer la isla necesita su pecera con ruedas. A veces necesitamos ayuda o una herramienta para hacer lo que queremos. Todos merecemos tener la oportunidad de intentarlo.","Rowen y Ali tienen distintas maneras de desplazarse. Para compartir la isla, Rowen puede necesitar caminos adecuados para su pecera. Dar las mismas oportunidades no siempre significa ofrecer a todos exactamente lo mismo."],["Si alguien dice que Rowen no puede hacer algo sin dejarlo probar, quizá se pierda una sorpresa. Podemos preguntarle qué quiere hacer y darle la oportunidad de intentarlo.","Si Ali decidiera por Rowen lo que él puede hacer, podría impedirle participar en algo que disfruta. Escucharlo y dejar que muestre sus capacidades es una manera de respetar sus decisiones."],["Rowen puede nadar en el agua, pero necesita su pecera con ruedas para desplazarse por la isla. A veces podemos cambiar algo de un lugar para que nuestros amigos también puedan participar. ¿Cómo podríamos ayudar a Rowen?","Rowen no necesita aprender a moverse como Ali para compartir la isla con ella. Necesita encontrar caminos por los que pueda desplazarse con su pecera. Incluir también significa cambiar las condiciones de un lugar para que todos puedan participar."]],[["Ali se arrastra y Rowen nada. Ninguno es mejor por moverse de esa manera. Aunque seamos diferentes, todos merecemos cariño y respeto.","Ali y Rowen disfrutan de lugares y movimientos distintos. Si uno pensara que su manera de vivir es la mejor, podría hacer sentir menos importante al otro. Respetarnos significa aceptar que existen otras maneras de ser y vivir."],["Al principio, Ali y Rowen pensaban que el otro se movía de una manera rara. Cuando preguntamos y escuchamos, podemos descubrir cosas que no sabíamos de nuestros amigos.","La primera impresión de Ali y Rowen no les permitía conocer todas sus capacidades. Si escuchamos a alguien antes de juzgarlo, podemos descubrir sus gustos, sentimientos y experiencias sin reducirlo a una diferencia."],["Rowen y Ali pueden disfrutar de estar juntos aunque uno nade y la otra se arrastre. Podemos conversar, jugar y compartir sin tener que ser iguales.","Rowen y Ali tienen capacidades diferentes, pero ambos merecen ser escuchados, respetados y tener amigos. Podemos compartir sentimientos, intereses y experiencias sin pedirle a nadie que cambie su manera de ser."]]];
let age=1,step=0,selected=[null,null,null,null],dialogueStep=0,scenes=[];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function arrayFrom(code,name){const start=code.indexOf("const "+name+"=");if(start<0)throw Error(name);let p=code.indexOf("[",start),depth=0,quote="",escape=false;for(let i=p;i<code.length;i++){let c=code[i];if(quote){if(escape)escape=false;else if(c==="\\")escape=true;else if(c===quote)quote="";continue}if(c==="'"||c==='"'){quote=c;continue}if(c==="[")depth++;if(c==="]"&&!--depth)return code.slice(p,i+1)}throw Error(name)}
function parseStrings(s){return JSON.parse(s.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g,(_,x)=>JSON.stringify(x.replace(/\\'/g,"'"))))}
async function load(n){const res=await fetch("Momento_"+n+".html");if(!res.ok)throw Error("Momento "+n);const doc=new DOMParser().parseFromString(await res.text(),"text/html");const code=[...doc.scripts].map(x=>x.textContent).join("\n");const img=doc.querySelector(".scene img,.panorama");let q=doc.querySelector("#question,.panel h2").textContent,items;if(n<=2){const questions=parseStrings(arrayFrom(code,"questions")),refs=parseStrings(arrayFrom(code,"reflections"));items=[...doc.querySelectorAll(".choice")].map((b,i)=>({option:b.textContent,question:questions[i],reflections:refs[i]}))}else {items=JSON.parse(arrayFrom(code,"content"));items.forEach((item,i)=>{item.reflections[0]=revised[n-3][i][0];item.reflections[1]=revised[n-3][i][1]})}return {image:img.getAttribute("src"),alt:img.alt,q,items,intro:doc.querySelector(".introduccion")?.textContent||"",lines:n===1?parseStrings(arrayFrom(code,"lines")):[]}}
function reveal(){requestAnimationFrame(()=>{const e=document.querySelector(".reflection,.question");if(e&&e.getBoundingClientRect().bottom>innerHeight-60)e.scrollIntoView({block:"nearest",behavior:"smooth"})})}
function render(){const end=step===4;document.getElementById("pedagogicalHeading").textContent=headings[step][0];document.getElementById("narrativeHeading").textContent=headings[step][1];document.getElementById("momentDots").innerHTML=Array.from({length:5},(_,i)=>'<span class="moment-dot'+(i===step?' active':'')+'"></span>').join("");document.getElementById("momentDots").setAttribute("aria-label","Momento "+(step+1)+" de 5");document.querySelectorAll("[data-age]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.age===age)));if(end){app.innerHTML='<section class="panel closing-panel"><div class="union-knot-wide"><img src="../revision-menu-tres-experiencias/hilo-que-nos-une.png" alt="Dos hilos dorados unidos"></div><p>'+closing[age][0]+'</p><h2>'+closing[age][1]+'</h2><p>'+closing[age][2]+'</p><p><strong>No necesitamos ser iguales para estar unidos. Cada vez que escuchamos, respetamos y cuidamos a alguien, tejemos un mundo donde todos podemos tener un lugar.</strong></p><p><em>El hilo amarillo siguió su camino hacia otras islas.</em></p><nav class="nav"><button class="next secondary" id="back">← Anterior</button><button class="next" id="restart">Volver a empezar</button></nav></section>';document.getElementById("back").onclick=()=>{step=3;render();scrollTo(0,0)};document.getElementById("restart").onclick=()=>{step=0;selected=[null,null,null,null];dialogueStep=0;render();scrollTo(0,0)};return}
const s=scenes[step],pick=selected[step],ready=step!==0||dialogueStep>=5;let out='<div class="scene water"><img alt="'+esc(s.alt)+'" src="'+esc(s.image)+'"></div><section class="panel">';
if(pick!==null){const item=s.items[pick];out+='<div class="reflection"><strong>Para pensar juntos</strong><p><b>'+esc(item.question)+'</b></p><p>'+esc(item.reflections[age])+'</p></div><button class="choice" id="change" style="margin-top:10px;width:100%;text-align:center">Elegir otra respuesta</button>'}else{if(step===0){out+='<div class="dialogue"><p class="intro">'+esc(s.intro)+'</p>'+s.lines.slice(0,Math.min(dialogueStep,4)).map(d=>'<p><b>'+esc(d[0])+':</b> —'+esc(d[1])+'</p>').join("")+'</div>';if(!ready)out+='<div class="dialogue-controls"><button class="next" id="dialogueNext">'+(dialogueStep===0?'Comenzar el encuentro':dialogueStep===4?'Para pensar juntos':'Continuar el diálogo')+'</button></div>'}if(ready)out+='<div class="question">'+esc(s.q)+'</div><p class="small">*Elige una opción para continuar</p><div class="choices">'+s.items.map((x,i)=>'<button class="choice" data-pick="'+i+'">'+esc(x.option)+'</button>').join("")+'</div>'}
out+='</section><nav class="nav"><button class="next secondary" id="back" '+(step===0?'disabled':'')+'>← Anterior</button><button class="next" id="forward" '+(pick===null?'disabled':'')+'>'+(step===3?'Descubrir el hilo →':'Continuar →')+'</button></nav>';app.innerHTML=out;
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{selected[step]=+b.dataset.pick;render();reveal()});const change=document.getElementById("change");if(change)change.onclick=()=>{selected[step]=null;render();reveal()};const dn=document.getElementById("dialogueNext");if(dn)dn.onclick=()=>{dialogueStep++;render()};document.getElementById("back").onclick=()=>{step--;render();scrollTo(0,0)};document.getElementById("forward").onclick=()=>{step++;render();scrollTo(0,0)}}
document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{age=+b.dataset.age;if(scenes.length)render()});app.textContent="Cargando la experiencia…";Promise.all([1,2,3,4].map(load)).then(s=>{scenes=s;render()}).catch(e=>{app.textContent="No se pudo cargar la experiencia. Recarga la página. "+e.message});
</script></body></html>
