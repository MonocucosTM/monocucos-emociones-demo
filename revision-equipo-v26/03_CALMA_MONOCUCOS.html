</style></head><body><header></header><div class="shell"><main class="app"><div class="top"><img class="brand-logo" alt="MONOCUCOS" src="assets/da1aea32575e27ba.png"><span class="step" id="step"></span></div><div class="progress"><div class="bar" id="bar"></div></div><section class="stage"><div class="copy"><div class="eyebrow" id="tag"></div><h1 id="title"></h1><p id="story"></p><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div id="choice-hint" class="choice-hint">*Elige una opción para continuar</div><div class="feedback hidden" id="feedback"></div><div class="controls"><button class="secondary" id="prev">← Anterior</button><button class="primary" id="next"></button></div></div><div class="art"><img id="photo" alt="Ilustración original de Gaggo y Huevito"></div></section><div class="bottom"><div class="dots" id="dots"></div><div id="age-picker" class="age-picker"><span class="age-label">Selecciona tu edad:</span><div class="age-buttons"><button type="button" data-age="0">4–6 años</button><button type="button" data-age="1" class="active">7–8 años</button><button type="button" data-age="2">9–10 años</button></div></div><span id="age-badge" class="age-badge hidden">Edad: 7–8 años</span></div></main></div><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Conoce a los protagonistas"><div class="modal-label">MONOCUCOS · CONOCE A LOS PROTAGONISTAS</div><div id="introArt"></div><h2 id="introTitle"></h2><p id="introBody"></p><p class="accent" id="introExtra"></p><button id="introNext"></button><small id="introCount"></small></div></div><script>const pics=["assets/0cd22ce714bcb9f2.png", "assets/445523855bf8aea4.png", "assets/18c5efc0a0f073c2.png", "assets/8cb7ec4653a0e193.png", "assets/ecae655b1c8e55d0.png", "assets/555fc8399c131974.png", "assets/631162e15f3bfdf0.png"], stages=[["01 · BIENVENIDA", "Gaggo y Huevito · Mi lugar tranquilo", "Gaggo es un tigre amable y curioso. Le encanta leer, investigar y descubrir cómo funcionan las cosas. A veces está tan seguro de tener razón que olvida escuchar. Huevito, su hijo, es un pequeño pingüino observador, sensible y atento. Hoy Huevito tiene algo especial que enseñarle a su papá.", "¡Vamos, Gaggo! →"], ["02 · RECONOCER", "¿Cómo se siente mi cuerpo?", "Huevito se sienta sobre el hongo y observa el atardecer. Gaggo llega con muchas ideas en la cabeza. «Papá, ¿notas cómo estás respirando?», pregunta Huevito. Gaggo se detiene un instante. A veces estamos tan ocupados que olvidamos escuchar lo que sentimos.", "Escuchar un poquito más →"], ["03 · COMPRENDER", "Escuchar también es aprender", "Gaggo adora buscar respuestas en los libros. Pero Huevito le muestra otra manera de descubrir: prestar atención a su cuerpo, sus pensamientos y a quienes lo acompañan. La calma no significa que todo esté en silencio: significa encontrar un momento para escucharnos.", "Encontrar mi lugar tranquilo →"], ["04 · APRENDER", "Mi lugar tranquilo", "Gaggo se acomoda y descansa. Huevito le propone un pequeño ejercicio: sentir dónde apoya el cuerpo, respirar sin prisa y observar lo que lo rodea. No tienen que resolverlo todo ahora. Gaggo descubre que detenerse también es una forma de cuidarse.", "Llevar la calma conmigo →"], ["05 · PARA LLEVAR CONTIGO", "La calma va conmigo", "Huevito se prepara para seguir su camino. Su lugar tranquilo no está solamente bajo el árbol: puede recordarlo cuando lo necesite. Gaggo sonríe al comprender lo que su hijo le ha enseñado: «La calma también se encuentra cuando nos escuchamos».", "Volver al comienzo ↺"]];
const questions=[["¿Qué crees que puede estar sintiendo Gaggo cuando tiene tantas ideas en la cabeza?", ["Puede sentirse inquieto porque está pensando en muchas cosas.", "Puede sentirse emocionado por todo lo que quiere descubrir.", "Puede sentirse cansado y necesitar un momento de descanso."]], ["¿Qué podría descubrir Gaggo si se detiene un momento a escuchar su cuerpo?", ["Que está respirando muy rápido y se siente inquieto.", "Que tiene mucha energía y ganas de seguir descubriendo cosas.", "Que está cansado y necesita descansar un poquito."]], ["¿Qué puede aprender Gaggo cuando se detiene a escucharse y escucha a Huevito?", ["Que puede descubrir cómo se siente, aunque todavía no sepa explicarlo.", "Que escuchar a Huevito puede enseñarle algo que no había descubierto en sus libros.", "Que no necesita tener todas las respuestas para disfrutar de un momento de calma."]], ["Huevito invita a Gaggo a encontrar un momento de calma. ¿Qué te gustaría intentar tú?", ["Sentir dónde se apoya mi cuerpo y respirar a mi propio ritmo.", "Observar tranquilamente algo que esté a mi alrededor.", "Prefiero no hacer el ejercicio ahora. Puedo intentarlo en otro momento."]], ["¿Qué podemos aprender de Gaggo y Huevito para encontrar nuestros propios momentos de calma?", ["Escuchar lo que siento y reconocer cuándo necesito una pausa.", "Buscar mi propia manera de sentirme tranquilo, aunque sea diferente a la de otras personas.", "Recordar que puedo pedir compañía cuando me resulta difícil encontrar la calma."]]];
const reflections=[[["Cuando pensamos en muchas cosas al mismo tiempo, podemos sentirnos inquietos. A veces necesitamos detenernos un poquito para descubrir cómo estamos.", "Tener muchas ideas puede ser emocionante, pero también puede hacernos sentir inquietos. Prestar atención a nuestros pensamientos y a nuestro cuerpo nos ayuda a reconocer cuándo necesitamos una pausa.", "Cuando nuestra mente está ocupada con muchas ideas, podemos experimentar inquietud incluso si estamos haciendo algo que nos gusta. Reconocer esa sensación nos permite decidir si queremos continuar, cambiar de actividad o tomarnos un momento para descansar."], ["¡Tener muchas ideas puede ser divertido! Podemos sentir alegría y emoción cuando descubrimos cosas nuevas. También podemos descansar cuando lo necesitamos.", "La curiosidad puede llenarnos de energía y entusiasmo. Estar emocionados no significa que debamos hacer todo inmediatamente. Podemos disfrutar de nuestras ideas y encontrar momentos para descansar.", "Sentir entusiasmo por aprender y descubrir es algo valioso. Sin embargo, incluso las actividades que disfrutamos pueden exigirnos mucha atención. Aprender a equilibrar la curiosidad con momentos de descanso también forma parte del autocuidado."], ["A veces nuestro cuerpo nos dice que necesita descansar. Podemos sentirnos cansados, respirar tranquilamente y buscar un lugar donde estar cómodos.", "Cuando hacemos muchas cosas, nuestro cuerpo y nuestra mente pueden necesitar una pausa. Reconocer el cansancio nos ayuda a cuidarnos, aunque todavía tengamos ganas de seguir jugando o aprendiendo.", "El cansancio puede aparecer cuando dedicamos mucha energía a pensar, aprender o resolver problemas. Reconocer nuestros límites no significa renunciar a lo que queremos hacer, sino encontrar una manera de continuar sin descuidar nuestro bienestar."]], [["Cuando estamos inquietos, a veces respiramos más rápido o sentimos que nuestro corazón late muy fuerte. Podemos detenernos un momento y observar cómo se siente nuestro cuerpo.", "Nuestro cuerpo puede mostrarnos que estamos inquietos antes de que sepamos explicar lo que sentimos. La respiración rápida, los músculos tensos o las ganas de movernos pueden ser algunas señales. Prestarles atención nos ayuda a conocernos mejor.", "Cuando experimentamos inquietud, nuestro cuerpo puede reaccionar de distintas maneras: cambia nuestra respiración, aumenta la tensión muscular o sentimos dificultad para permanecer quietos. Reconocer estas señales nos ayuda a comprender nuestro estado emocional y decidir qué necesitamos, sin exigirnos recuperar la calma inmediatamente."], ["A veces nuestro cuerpo está lleno de energía. Tenemos ganas de jugar, movernos y descubrir cosas nuevas. ¡También podemos sentirnos bien cuando estamos muy activos!", "Tener mucha energía puede ser una señal de entusiasmo o curiosidad. No siempre necesitamos calmarnos cuando estamos activos. Lo importante es aprender a reconocer cómo nos sentimos y qué necesita nuestro cuerpo.", "La actividad y el entusiasmo no son necesariamente señales de malestar. Podemos sentirnos llenos de energía cuando algo despierta nuestra curiosidad. Escuchar nuestro cuerpo también significa reconocer cuándo disfrutamos de esa actividad y cuándo comenzamos a necesitar una pausa."], ["Cuando estamos cansados, podemos sentir los ojos pesados, querer sentarnos o tener menos ganas de movernos. Nuestro cuerpo nos está diciendo que necesita descansar, y podemos escucharlo.", "A veces seguimos haciendo cosas sin notar que estamos cansados. Detenernos un momento puede ayudarnos a reconocer señales como la falta de energía, el sueño o la dificultad para concentrarnos. Descansar también es una manera de cuidarnos.", "El cansancio no siempre aparece de forma evidente. Podemos sentir dificultad para concentrarnos, irritabilidad o menos energía de lo habitual. Aprender a identificar estas señales nos permite reconocer nuestros límites y buscar momentos de descanso antes de sentirnos completamente agotados."]], [["A veces sentimos algo en nuestro cuerpo, pero no sabemos cómo se llama. Podemos detenernos y prestar atención. No tenemos que encontrar las palabras inmediatamente para comenzar a conocernos.", "No siempre es fácil explicar lo que sentimos. A veces necesitamos un momento para reconocer nuestras emociones y las señales de nuestro cuerpo. Escucharnos con paciencia puede ayudarnos a comprenderlas mejor.", "Reconocer una emoción no significa que debamos comprenderla completamente desde el primer momento. Algunas sensaciones son difíciles de identificar o expresar. Darnos tiempo para observarlas, sin juzgarnos ni exigirnos una respuesta inmediata, puede ayudarnos a conocernos mejor."], ["Gaggo sabe muchas cosas porque le encanta leer. Pero Huevito también tiene algo importante que enseñarle. ¡Los grandes también pueden aprender de los pequeños!", "Podemos aprender muchas cosas leyendo y estudiando, pero también escuchando a quienes nos rodean. Cuando Gaggo presta atención a Huevito, descubre una manera diferente de comprender lo que siente. Todos tenemos algo que enseñar y algo que aprender.", "Tener conocimientos no significa que siempre comprendamos todas las situaciones o experiencias. Escuchar las perspectivas de otras personas, incluso de quienes son más pequeños que nosotros, puede ayudarnos a descubrir aspectos que no habíamos considerado. Aprender también requiere reconocer que no lo sabemos todo."], ["No tenemos que saberlo todo ni resolverlo todo enseguida. A veces podemos descansar, mirar a nuestro alrededor y disfrutar de un momento tranquilo.", "Cuando algo nos preocupa, podemos sentir que necesitamos encontrar una respuesta inmediatamente. Pero algunas cosas necesitan tiempo. Hacer una pausa puede ayudarnos a sentirnos mejor mientras descubrimos qué hacer.", "En ocasiones queremos comprender o resolver inmediatamente todo lo que sucede. Sin embargo, no siempre tenemos la información o las respuestas que necesitamos. Aprender a convivir con algunas dudas, sin exigirnos resolverlas de inmediato, puede ayudarnos a reducir la presión que sentimos y encontrar momentos de tranquilidad."]], [["Puedes sentir tus pies sobre el suelo o tu cuerpo sobre la silla. Respira como te resulte cómodo. No tienes que hacerlo de una manera especial. Puedes descubrir cómo se siente tu cuerpo cuando te detienes un momento.", "Prestar atención a cómo se apoya nuestro cuerpo y observar nuestra respiración puede ayudarnos a reconocer cómo nos sentimos. No necesitamos respirar de una manera perfecta ni conseguir que desaparezcan nuestras emociones. Podemos simplemente observarlas.", "Observar los puntos de apoyo de nuestro cuerpo y prestar atención a la respiración puede ayudarnos a conectar con el momento presente. No se trata de controlar lo que sentimos ni de alcanzar inmediatamente un estado de tranquilidad. Podemos explorar estas sensaciones a nuestro ritmo, reconociendo que cada persona experimenta la calma de manera diferente."], ["Mira a tu alrededor. Puedes encontrar un color, una forma o algo que te guste. A veces descubrimos cosas bonitas cuando nos detenemos a observar.", "Cuando prestamos atención a algo que nos rodea, podemos descubrir detalles que antes no habíamos notado. Observar los colores, las formas o los sonidos puede ayudarnos a hacer una pausa y reconocer cómo nos sentimos.", "Dirigir nuestra atención hacia algún elemento del entorno puede ofrecernos una manera de hacer una pausa cuando tenemos muchos pensamientos. Podemos observar sus colores, formas o sonidos sin necesidad de interpretarlos. Esta práctica no elimina necesariamente nuestras preocupaciones, pero puede ayudarnos a relacionarnos con ellas de otra manera."], ["¡Está bien! No tienes que hacerlo ahora. Puedes descansar, jugar o intentarlo cuando quieras. Cada persona tiene su momento.", "No siempre tenemos ganas de detenernos o hacer un ejercicio de calma. Podemos reconocer cómo nos sentimos y decidir cuándo queremos intentarlo. Respetar nuestras necesidades también es una manera de cuidarnos.", "Las estrategias de calma no funcionan de la misma manera para todas las personas ni en todas las situaciones. Reconocer que no deseamos realizar un ejercicio en determinado momento también puede ser una forma de escucharnos. Podemos explorar otras alternativas o volver a intentarlo cuando nos sintamos preparados."]], [["A veces tenemos muchas ganas de jugar, pensar o hacer cosas. También podemos sentirnos cansados o inquietos. Escuchar nuestro cuerpo nos ayuda a descubrir cuándo necesitamos descansar un poquito.", "No siempre nos damos cuenta de que necesitamos detenernos. Prestar atención a nuestras emociones, pensamientos y sensaciones corporales puede ayudarnos a reconocer cuándo necesitamos una pausa. Aprender a escucharnos es una manera de cuidarnos.", "En nuestra vida cotidiana podemos experimentar entusiasmo, inquietud, cansancio y muchas otras sensaciones. Reconocerlas nos permite comprender mejor nuestras necesidades y decidir cuándo conviene hacer una pausa. Escucharnos no significa abandonar nuestras responsabilidades, sino aprender a atenderlas sin descuidar nuestro bienestar."], ["A algunas personas les gusta descansar, a otras dibujar, escuchar música o estar en un lugar tranquilo. Podemos descubrir qué cosas nos hacen sentir bien. ¡No todos necesitamos lo mismo!", "Cada persona puede encontrar tranquilidad de una manera diferente. Algunas prefieren estar en silencio; otras disfrutan dibujando, caminando o conversando. Conocer nuestras preferencias nos ayuda a descubrir qué podemos hacer cuando necesitamos una pausa.", "No existe una única manera de experimentar la calma. Las estrategias que ayudan a una persona pueden no resultar adecuadas para otra, y nuestras propias necesidades pueden cambiar según la situación. Explorar diferentes posibilidades, respetando nuestras preferencias y las de los demás, nos permite desarrollar maneras personales de cuidarnos."], ["A veces necesitamos que alguien nos acompañe. Podemos buscar a una persona de confianza, contarle cómo nos sentimos o pedirle que esté con nosotros. No tenemos que hacerlo todo solos.", "Hay momentos en los que resulta difícil encontrar tranquilidad por nuestra cuenta. Hablar con alguien de confianza, pedir compañía o compartir lo que sentimos puede ayudarnos. Buscar apoyo también es una manera de cuidarnos.", "Desarrollar recursos personales para encontrar la calma no significa que debamos afrontar todas las situaciones sin ayuda. Cuando nos sentimos sobrepasados, reconocer que necesitamos acompañamiento y acudir a alguien de confianza puede ayudarnos a comprender lo que ocurre y encontrar alternativas. La autonomía también incluye saber cuándo pedir apoyo."]]];
const ageLabels=['4–6 años','7–8 años','9–10 años'];
let current=0,intro=0,age=1,selected={};
const $=id=>document.getElementById(id);
function updateAgeUI(){
 document.querySelectorAll('#age-picker button').forEach(b=>b.classList.toggle('active',Number(b.dataset.age)===age));
 $('age-picker').classList.toggle('hidden',current!==0);
 $('age-badge').classList.toggle('hidden',current===0);
 $('age-badge').textContent='Edad: '+ageLabels[age];
}
function scrollToStage(){
 const el=document.querySelector('.stage'),r=el.getBoundingClientRect();
 if(r.top<0||r.top>innerHeight*.6)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function revealFeedback(){
 // Tras actualizar la reflexión, desplazar suavemente el documento hasta verla.
 // En Safari, esperar a que termine la maquetación evita un scroll imperceptible.
 setTimeout(()=>{
   const el=$('feedback');if(el.classList.contains('hidden'))return;
   const rect=el.getBoundingClientRect();
   if(rect.bottom>innerHeight-35 || rect.top<20){
     const destination=Math.max(0,scrollY+rect.top-Math.max(35,innerHeight*.43));
     window.scrollTo({top:destination,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
   }
 },90);
}
function render(shouldScroll=false){
 const s=stages[current],q=questions[current];
 $('tag').textContent=s[0];$('title').textContent=s[1];$('story').textContent=s[2];
 $('next').textContent=current===4?'Volver a comenzar ↺':s[3];
 $('photo').src=pics[current+2];
 $('step').textContent=`Pantalla ${current+1} de 5`;
 $('bar').style.width=((current+1)*20)+'%';
 $('prev').disabled=current===0;
 $('dots').innerHTML=stages.map((_,i)=>`<span class="dot ${i===current?'active':''}"></span>`).join('');
 $('prompt').textContent=q[0];
