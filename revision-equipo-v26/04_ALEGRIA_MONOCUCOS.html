</style></head><body><main class="shell"><section class="app"><div class="top"><span class="brand"><img class="brand-logo" alt="MONOCUCOS" src="assets/da1aea32575e27ba.png"></span><span class="stepnum" id="counter"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="stage"><div><div class="eyebrow" id="label"></div><h1 id="title"></h1><p class="desc" id="desc"></p><div class="question" id="question"></div><p id="choiceHint" class="choice-hint">* Elige una opción para descubrir qué sucede.</p><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"></div><div class="controls"><button class="secondary" id="back">← Anterior</button><button class="primary" id="next">Continuar →</button></div></div><div class="visual"><img id="scene" alt="Ilustración original de MONOCUCOS"></div></div><div class="bottom"><div id="age-picker" class="age-buttons"><span>Selecciona tu edad:</span><button type="button" data-age="0">4–6 años</button><button type="button" data-age="1" class="active">7–8 años</button><button type="button" data-age="2">9–10 años</button></div><span id="age-badge" class="hidden">Edad: 7–8 años</span><span class="dots" id="dots"></span></div></section></main><div class="overlay" id="overlay"><div class="modal"><div class="eyebrow">MONOCUCOS · CONOCE A LOS PROTAGONISTAS</div><img id="portrait" alt="Personaje original"><h2 id="who"></h2><p id="bio"></p><p class="quote" id="quote"></p><button class="primary" id="modalNext">Continuar →</button><p style="font-size:13px" id="modalcount"></p></div></div><script>
const images=["assets/8bb804fd16d3c9fc.png", "assets/a9d4e4ca521b30af.png", "assets/cdc59a5049014bea.png", "assets/32c774b2fc6c49c9.png", "assets/b9cdf9c142a4969c.png", "assets/fd5193077fc92ff1.png", "assets/e5ef81716f5287e5.png", "assets/08d46594e7e46945.png"];
const steps=[["El chiste de Pakik", "Reconocer antes de suponer", "Pakik cuenta un chiste. Niku apenas sonríe y continúa pintando. Pakik se pregunta si estará disfrutando.", "¿Qué podría hacer Pakik para saber cómo se siente Niku?", ["Preguntarle cómo se siente.", "Contarle muchos más chistes.", "Pensar que está triste."], [["Pakik: —¡Niku! ¿Estás contenta?\nNiku: —¡Muchísimo!", "Preguntar nos ayuda a comprender lo que sienten los demás."], ["Pakik: —¡Tengo otros diez chistes!\nNiku: —¡Qué divertido! Pero ahora quiero seguir pintando.", "Algo que nos hace felices no siempre es lo que otra persona necesita o disfruta."], ["Pakik: —¿Estará triste? Quizá debería preguntarle antes de suponer.", "No siempre podemos saber cómo se siente alguien solo por su expresión."]]], ["Los colores de Niku", "Comprender y respetar", "Niku le cuenta a Pakik que expresa su alegría pintando.", "¿Cómo podría Pakik compartir la alegría de Niku?", ["Preguntarle qué está pintando.", "Pedirle que deje de pintar.", "Pintar sobre su dibujo sin preguntarle."], [["Pakik: —¡Niku! ¿Qué estás pintando?\nNiku: —¡Los colores de mi alegría!", "Mostrar interés por lo que disfruta otra persona es una manera de acompañarla."], ["Pakik: —¡Vamos a jugar! ¡Deja los pinceles!\nNiku: —Me gusta jugar, pero ahora quiero terminar mi pintura.", "Compartir la alegría no significa que todos debamos hacer lo mismo."], ["Pakik: —¡Yo también quiero pintar!\nNiku: —Me encanta compartir, pero prefiero que me preguntes antes de pintar en mi dibujo.", "Respetar lo que es importante para otra persona también es una forma de cuidarla."]]], ["La canción de Ali", "Escuchar para comprender", "Ali llega cantando y les cuenta que está muy alegre.", "¿Cómo sabemos que Ali está alegre?", ["Porque nos contó cómo se siente.", "Porque todas las canciones son alegres.", "Porque quien canta nunca está triste."], [["Ali: —¡Exacto! Hoy canto porque estoy feliz.", "Escuchar lo que alguien nos cuenta sobre sus emociones nos ayuda a comprenderlo."], ["Ali: —¡No siempre! A veces canto cuando estoy triste.", "La música puede expresar muchas emociones diferentes."], ["Ali: —A veces estoy triste y también me gusta cantar.", "Una misma actividad puede ayudarnos a expresar emociones distintas."]]], ["¡Todos al mismo tiempo!", "Compartir y dar espacio", "Pakik quiere contar un chiste, Ali quiere cantar y Niku quiere mostrar su pintura.", "¿Qué pueden hacer para disfrutar juntos?", ["Escucharse y dar espacio a cada uno.", "Elegir quién expresa mejor su alegría.", "Pedirle a Niku que hable más fuerte."], [["Ali: —¡Primero escuchamos el chiste, después vemos la pintura y luego cantamos!\nPakik: —¡Trato hecho!", "Escucharnos permite que todos podamos compartir nuestra alegría."], ["Pakik: —¿Quién de nosotros será el más divertido?\nNiku: —¡Pero no es una competencia!", "No existe una única manera correcta de expresar la alegría."], ["Pakik: —¡Niku, habla más fuerte!\nNiku: —Prefiero mostrarles mi pintura.", "No necesitamos expresarnos de la misma manera para participar y sentirnos incluidos."]]], ["Una alegría compartida", "Reconocer nuestra propia alegría", "Niku muestra una pintura de los tres amigos. Pakik se ríe, Ali canta y Niku sonríe. Sus hilos se entrelazan y tejen una sonrisa.", "¿Qué has descubierto sobre las diferentes maneras de vivir y compartir la alegría?", ["Que puedo expresar mi alegría a mi manera: riendo, creando, cantando o jugando.", "Que puedo comprender la alegría de alguien, aunque disfrutemos de cosas diferentes.", "Que podemos compartir momentos felices respetando cómo participa cada persona."], []]];
const intro=[["Pakik", "¡Hola! Soy Pakik. Me encanta contar chistes y hacer reír a mis amigos. A veces me entusiasmo tanto que olvido que no todos se divierten con las mismas cosas.", "¡Qué alegría encontrarnos!"], ["Niku", "¡Hola! Soy Niku. Me gusta pintar y llenar de colores lo que imagino. No siempre necesito hablar mucho para expresar lo que siento.", "¡Los colores también cuentan historias!"], ["Ali", "¡Hola! Soy Ali. Me encanta cantar y crear canciones. Con mi voz puedo expresar muchas emociones, y hoy tengo muchas ganas de compartir mi alegría.", "¡Hay muchas formas de expresar lo que sentimos!"]];
const reflections=[[["A veces creemos que alguien está triste porque no se ríe. Pero no podemos saberlo solo por su cara. ¡Podemos preguntarle cómo se siente!", "Una sonrisa pequeña no significa que alguien disfrute menos. Preguntar con amabilidad nos ayuda a conocer cómo se siente una persona, sin adivinarlo por su expresión.", "No podemos determinar con certeza las emociones de otra persona observando únicamente su comportamiento. Preguntar y escuchar su respuesta evita suposiciones y respeta su propia experiencia."], ["A Pakik le encanta contar chistes. Pero Niku también puede ser feliz pintando. ¡No todos disfrutamos de las mismas cosas!", "Algo que nos entusiasma puede no ser lo que otra persona quiere hacer en ese momento. Podemos ofrecer compartir nuestra alegría y respetar sus preferencias.", "Querer compartir algo que nos produce alegría es valioso, pero insistir puede hacer que otra persona se sienta presionada. La empatía implica reconocer sus preferencias y respetar su decisión."], ["A veces pensamos que alguien está triste porque no se ríe. Podemos preguntarle antes de decidir qué siente.", "Una expresión seria no significa necesariamente tristeza. Antes de sacar conclusiones, podemos mostrar interés y preguntar cómo se siente la otra persona.", "Interpretar emociones a partir de expresiones externas puede llevarnos a equivocarnos. La escucha y las preguntas abiertas ayudan a comprender sin imponer nuestras interpretaciones."]], [["Podemos preguntar a Niku qué está pintando. Escuchar lo que le gusta es una forma de acompañar su alegría.", "Mostrar curiosidad por lo que alguien crea nos permite conocerlo mejor. No necesitamos compartir sus gustos para reconocer que son importantes para esa persona.", "Preguntar con interés, sin juzgar ni interpretar su creación, reconoce que cada persona decide qué significa para ella lo que hace y siente."], ["Niku disfruta pintando. Aunque Pakik quiera jugar, puede esperar o buscar otra actividad. ¡Cada uno puede disfrutar a su manera!", "Compartir un momento no significa hacer todos lo mismo. Respetar que Niku quiera terminar su pintura también es una manera de cuidar la amistad.", "Invitar a otra persona a una actividad no significa exigir su participación. Respetar su decisión protege su autonomía y permite compartir sin uniformar los intereses."], ["Antes de pintar en el dibujo de Niku, Pakik puede preguntarle. Respetar lo que alguien creó también es cuidar su alegría.", "Podemos tener ganas de participar en la creación de un amigo, pero primero debemos pedir permiso. Compartir materiales e ideas requiere respetar los límites de cada persona.", "La creatividad compartida no elimina la autoría ni las preferencias individuales. Pedir consentimiento antes de intervenir en una creación es una forma concreta de respeto."]], [["Ali nos cuenta que está alegre. Escucharlo nos ayuda a saber cómo se siente, ¡aunque cada uno cante de manera diferente!", "Ali expresa con palabras que está alegre. Escuchar lo que alguien nos cuenta es más útil que adivinar sus emociones por la actividad que realiza.", "Una misma conducta puede acompañar emociones distintas. Atender a cómo la propia persona describe su experiencia evita interpretar automáticamente sus sentimientos."], ["Hay canciones alegres y canciones tristes. ¡Podemos cantar para expresar muchas emociones!", "La música puede acompañarnos cuando sentimos alegría, tristeza u otras emociones. No todas las canciones ni todas las personas sienten lo mismo al cantar.", "No existe una correspondencia fija entre una actividad artística y una emoción. La música puede expresar experiencias diversas, y su significado depende de cada persona y contexto."], ["A veces cantamos cuando estamos contentos y otras veces cuando estamos tristes. ¡Las dos cosas pueden pasar!", "Que alguien cante no significa que siempre esté feliz. Podemos disfrutar una actividad y, al mismo tiempo, sentir emociones diferentes.", "Las emociones pueden coexistir y cambiar. Una actividad placentera no implica ausencia de tristeza; reconocer esa complejidad evita exigir una alegría permanente."]], [["Podemos escuchar el chiste de Pakik, mirar la pintura de Niku y oír a Ali. ¡Hay espacio para todos!", "Escucharnos y organizar turnos permite que cada amigo comparta lo que disfruta. Participar no significa expresarse de la misma manera.", "La inclusión requiere crear oportunidades reales para diferentes formas de expresión. Escuchar, dar espacio y acordar turnos evita que una sola voz domine la experiencia."], ["¡La alegría no es un concurso! Cada amigo tiene una forma especial de mostrarla.", "No hay una manera mejor de expresar alegría. Comparar quién canta, pinta o hace reír mejor puede convertir un momento compartido en una competencia innecesaria.", "Evaluar qué expresión de alegría es superior puede desvalorizar a quienes participan de otra manera. Reconocer la diversidad favorece vínculos basados en el respeto, no en la comparación."], ["Niku puede mostrar su pintura sin hablar fuerte. También podemos escuchar con los ojos y prestar atención.", "No todas las personas desean hablar alto o llamar la atención. Podemos dar espacio a distintas formas de participar, como mostrar una creación o escuchar.", "La participación no debería depender del volumen de la voz ni de la extroversión. Ofrecer alternativas permite que cada persona comparta de forma auténtica y voluntaria."]], [["Podemos reír, pintar, cantar, bailar, jugar o estar tranquilos. ¡Cada uno puede mostrar su alegría a su manera!", "La alegría puede expresarse con risas, música, juegos, creaciones o momentos tranquilos. No hay una única manera correcta de demostrarla.", "Las expresiones de alegría varían según la persona, la situación y sus preferencias. No debemos medir una emoción por su apariencia ni exigir que se manifieste de una forma determinada."], ["A veces un amigo disfruta algo diferente a lo que nos gusta. Podemos escucharlo y alegrarnos por él.", "Comprender la felicidad de alguien no significa tener sus mismos gustos. Podemos mostrar interés y acompañarlo sin sentir exactamente lo mismo.", "La empatía también consiste en reconocer las experiencias positivas ajenas. Podemos valorar la alegría de otra persona sin compartir su interés ni experimentar su misma emoción."], ["Pakik cuenta chistes, Ali canta y Niku pinta. ¡Pueden disfrutar juntos sin hacer todos lo mismo!", "Los amigos pueden compartir un momento respetando lo que cada uno prefiere. Pertenecer a un grupo no significa hacer exactamente lo mismo.", "La convivencia inclusiva no exige uniformidad. Compartir experiencias respetando intereses y expresiones individuales permite que cada persona participe sin renunciar a su identidad."]]];
const ageLabels=['4–6 años','7–8 años','9–10 años'];
let i=0,chosen={},present=0,age=1;
const $=id=>document.getElementById(id);
function modal(){
 let p=intro[present];
 $('portrait').src=images[present];$('who').textContent=p[0];$('bio').textContent=p[1];
 $('quote').textContent='“'+p[2]+'”';
 $('modalcount').textContent='Presentación '+(present+1)+' de 3';
 $('modalNext').textContent=present===2?'Comenzar la historia →':'Continuar →';
}
$('modalNext').onclick=()=>{present++;if(present===3){$('overlay').classList.add('hidden');render();}else modal();};
function feedbackScroll(){
 setTimeout(()=>{
  const el=$('feedback'),box=el.getBoundingClientRect();
  if(box.bottom>innerHeight-28||box.top<12)
   window.scrollTo({top:Math.max(0,scrollY+box.top-Math.max(30,innerHeight*.40)),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 },110);
}
function render(scroll=false){
 const st=steps[i];$('label').textContent=String(i+1).padStart(2,'0')+' · '+st[1];
 $('title').textContent=st[0];$('desc').textContent=st[2];$('question').textContent=st[3];
 $('scene').src=images[i+3];$('counter').textContent=`Pantalla ${i+1} de 5`;
 $('bar').style.width=((i+1)*20)+'%';
 $('back').disabled=i===0;
 $('next').textContent=i===4?'Volver a comenzar ↺':'Continuar →';
 $('next').disabled=chosen[i]===undefined;
 $('dots').innerHTML=steps.map((_,k)=>`<span class="dot ${k===i?'active':''}"></span>`).join('');
 $('choices').innerHTML='';
 st[4].forEach((opt,j)=>{
  const b=document.createElement('button');b.className='choice'+(chosen[i]===j?' selected':'');
  b.textContent=opt;b.onclick=()=>{chosen[i]=j;render();feedbackScroll()};
  $('choices').appendChild(b);
 });
 const sel=chosen[i];$('choiceHint').hidden=sel!==undefined;
 $('feedback').classList.toggle('hidden',sel===undefined);
 if(sel!==undefined){
   $('feedback').replaceChildren();
   if(i<4&&st[5][sel]){
    const d=document.createElement('div');d.className='dialog';d.textContent=st[5][sel][0];$('feedback').appendChild(d);
    const original=document.createElement('div');original.className='original-lesson';original.textContent=st[5][sel][1];$('feedback').appendChild(original);
   }
   const reflect=document.createElement('div');reflect.className='age-reflection';
   reflect.textContent=reflections[i][sel][age];$('feedback').appendChild(reflect);
 }
 document.querySelectorAll('.age-buttons button').forEach(b=>b.classList.toggle('active',Number(b.dataset.age)===age));
 $('age-picker').classList.toggle('hidden',i!==0);
 $('age-badge').classList.toggle('hidden',i===0);
 $('age-badge').textContent='Edad: '+ageLabels[age];
 if(scroll)requestAnimationFrame(()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
}
document.querySelectorAll('.age-buttons button').forEach(b=>b.onclick=()=>{age=Number(b.dataset.age);render()});
function restart(){i=0;chosen={};present=0;render();modal();$('overlay').classList.remove('hidden');window.scrollTo({top:0,behavior:'auto'});}
$('next').onclick=()=>{if(chosen[i]===undefined)return;if(i===4)restart();else{i++;render(true)}};
$('back').onclick=()=>{if(i>0){i--;render(true)}};
render();modal();
</script><a href="MONOCUCOS_HISTORIAS_V18.html" aria-label="Volver a las historias" style="position:fixed;z-index:999999;bottom:18px;left:18px;background:#fffaf1;color:#283e38;border:1px solid #d9c9a8;border-radius:24px;padding:11px 16px;text-decoration:none;font:600 14px system-ui,-apple-system,sans-serif;box-shadow:0 3px 12px #0002">&#8592; Volver a las historias</a></body></html>
