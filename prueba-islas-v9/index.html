<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOCUCOS · Todos tenemos un lugar</title>
<style>body{margin:0;background:#f8f6ef;color:#304638;font-family:Optima,Palatino,serif}main{max-width:1200px;margin:auto;padding:18px}.info-panel{position:absolute;z-index:4;top:2.1%;left:2.2%;width:clamp(260px,27%,325px);box-sizing:border-box;padding:clamp(8px,1.1vw,14px);border-radius:15px;background:#fff9f0e8;box-shadow:0 2px 15px #0002;text-align:center;pointer-events:none}.info-panel img{display:block;width:clamp(65px,45%,105px);height:auto;margin:0 auto 6px}.info-panel h2{font-size:clamp(15px,1.55vw,21px);line-height:1.12;margin:0 0 5px;font-weight:500;white-space:nowrap}.info-panel p{font-size:clamp(10px,1vw,13px);line-height:1.25;margin:0}.scene{position:relative;aspect-ratio:3/2;background:#dcebe8;border-radius:18px;overflow:hidden}.scene > img{position:absolute;inset:0;width:100%;height:100%}.hot{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer}.hot:focus-visible{outline:3px solid #c99a38}.card{position:absolute;z-index:3;background:#fffdf4f2;border:1px solid #c9ad76;border-radius:14px;box-shadow:0 8px 28px #20392e55;padding:15px;width:min(32%,310px);transform:translate(-50%,-50%)}.card[hidden]{display:none}.card h2{margin:0 0 6px;font-size:1.2rem}.card p{margin:0 0 12px;line-height:1.4}.card a{color:#315740}.note{text-align:center;font-size:.85rem;margin-top:12px}@media(max-width:650px){.info-panel{width:43%;padding:6px;border-radius:10px}.info-panel img{width:55%;margin-bottom:3px}.info-panel h2{font-size:12px}.info-panel p{font-size:9px}main{padding:8px}.card{top:auto!important;left:50%!important;bottom:2%;transform:translateX(-50%);width:75%;font-size:.8rem;padding:10px}.card h2{font-size:1rem}}</style></head><body><main><div class="scene" id="scene"><div class="info-panel"><img src="logo-original.png" alt="Logo original MONOCUCOS"><h2>Todos tenemos un lugar</h2><p>Una experiencia para descubrir, crear y conectar.</p></div><img src="escenario-maestro-v9.png" alt="Escenario maestro original de seis islas"><button class="hot" style="left:1%;top:25%;width:17%;height:21%" data-id="mirador" aria-label="El Mirador"></button><button class="hot" style="left:38%;top:11%;width:15%;height:20%" data-id="rincon" aria-label="El Rincón Tranquilo"></button><button class="hot" style="left:72%;top:48%;width:24%;height:17%" data-id="agua" aria-label="La Isla del Agua"></button><section id="card" class="card" hidden><h2 id="name"></h2><p id="desc"></p><a id="explore" href="#" hidden>Explorar la isla</a><span id="status">Integración de la historia pendiente de publicación</span></section></div><p style="text-align:center;margin:14px 0 4px"><a href="../revision-menu-tres-experiencias/?vista=experiencias" style="color:#315740;text-decoration:underline;text-underline-offset:3px;font-size:1rem">← Volver al hilo</a></p><p class="note">Versión de preparación técnica. Las tres islas están conectadas en esta versión de prueba.</p></main><script>const items={mirador:{name:'El Mirador',desc:'Desde lo alto, Issa y Uli descubren que no todos vemos el mundo de la misma manera.',x:'29%',y:'33%'},rincon:{name:'El Rincón Tranquilo',desc:'Rulo disfruta de las cosas a su manera y a su propio ritmo. Algunos creen que es aburrido porque no se divierte como los demás, pero descubrirán que existen muchas formas de disfrutar y que ser diferente no significa ser menos interesante.',x:'61%',y:'23%'},agua:{name:'La Isla del Agua',desc:'En esta isla, el agua encuentra muchos caminos. Algunos nadan, otros se arrastran y otros descubren maneras de llegar. ¿Te gustaría conocerla?',x:'66%',y:'71%'}};const card=document.getElementById('card');const scene=document.getElementById('scene');let closeTimer=null;function cancelClose(){clearTimeout(closeTimer)}function closeCard(){cancelClose();card.hidden=true}function scheduleClose(){cancelClose();closeTimer=setTimeout(closeCard,180)}document.querySelectorAll('.hot').forEach(b=>{function show(){cancelClose();const i=items[b.dataset.id];document.getElementById('name').textContent=i.name;document.getElementById('desc').textContent=i.desc;card.style.left=i.x;card.style.top=i.y;const explore=document.getElementById('explore');const status=document.getElementById('status');if(b.dataset.id==='mirador'){explore.href='../el-mirador/?desde=islas-v9';explore.hidden=false;status.hidden=true}else if(b.dataset.id==='rincon'){explore.href='../el-rincon-tranquilo/';explore.hidden=false;status.hidden=true}else if(b.dataset.id==='agua'){explore.href='../la-isla-del-agua/';explore.hidden=false;status.hidden=true}else{explore.hidden=true;status.hidden=false}card.hidden=false}b.addEventListener('click',e=>{e.stopPropagation();show()});b.addEventListener('mouseenter',e=>{if(e.pointerType!=='touch')show()});b.addEventListener('mouseleave',scheduleClose);b.addEventListener('focus',show)});card.addEventListener('mouseenter',cancelClose);card.addEventListener('mouseleave',scheduleClose);card.addEventListener('click',e=>e.stopPropagation());scene.addEventListener('click',e=>{if(!e.target.closest('.hot')&&!e.target.closest('.card'))closeCard()});document.addEventListener('click',e=>{if(!scene.contains(e.target))closeCard()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});</script></body></html>
