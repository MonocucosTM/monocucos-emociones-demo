<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOCUCOS · El Espacio de Movimiento · Revisión</title><style>
:root{font-family:Optima,'Palatino Linotype',Georgia,serif;color:#413747;background:#f7f2ef}*{box-sizing:border-box}body{margin:0}.app{max-width:970px;margin:auto;padding:14px 18px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 16px;flex-wrap:wrap}.brand{font-size:14px;letter-spacing:.08em;font-weight:700}.sub{font-size:12px;color:#756978}.dots{display:flex;gap:9px;align-items:center}.dot{width:11px;height:11px;border:0;border-radius:100%;background:#d9d1d9;cursor:pointer;padding:0}.dot.on{background:#c79b31}.dot:last-child{width:17px;height:17px;border:2px solid #c79b31}.dot:last-child.on{background:#c79b31}.ghost,.primary{font:inherit;border-radius:22px;padding:10px 16px;cursor:pointer}.ghost{border:1px solid #d8cbd1;background:#fff9;color:#413747}.primary{border:0;background:#bd8f31;color:white;font-weight:700}.primary:disabled{opacity:.45;cursor:default}.stage{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #4d344016}.scene{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;background:#f7f2ef}.blank{aspect-ratio:3/1;background:linear-gradient(130deg,#f8f1e5,#f3e9ed);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;color:#9b7e57}.blank span{font-size:clamp(17px,3vw,27px)}.learning{max-width:790px;margin:16px auto 0;background:#fffaf4;border:1px solid #e9dccc;border-radius:20px;padding:25px 30px;box-shadow:0 8px 28px #55442c0b}.learning h1{font-size:clamp(21px,2.4vw,29px);font-weight:500;margin:0 0 12px}.story{line-height:1.55;margin:0 0 16px}.age-line{display:none;}.age-line-old{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;color:#64564a}.age-line-old select{font:15px Optima,Arial,sans-serif;padding:8px 12px;border:1px solid #cdbbaa;border-radius:10px;background:white;color:#39312b}.question{font-size:19px;margin:14px 0}.choices{display:grid;gap:10px}.choices button{font:inherit;border:1px solid #d7c4b2;text-align:left;border-radius:13px;padding:11px 13px;background:#fff;color:#433847;cursor:pointer}.choices button.selected{border-color:#b88c3d;background:#fff1d5}.reflection{margin-top:13px;background:#f6efe7;padding:16px;border-radius:14px;line-height:1.5}.reflection strong{display:block;margin-bottom:5px}.age-picker{display:flex;align-items:center;gap:7px}.age-picker button{font:inherit;font-size:13px;border:1px solid #dfd1c4;border-radius:22px;padding:7px 12px;background:#fffaf5;color:#514458;cursor:pointer}.age-picker button.active{background:#f3e2c6;border-color:#bb995d}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.small{color:#7b6d76;font-size:13px}.end{margin:14px 0;background:#f6efe7;border-radius:13px;padding:15px;line-height:1.55}.end b{display:block;margin-bottom:5px}.foot{text-align:center;color:#807380;font-size:12px;padding:12px}@media(max-width:650px){.app{padding:10px}.learning{padding:18px 16px}.top{gap:8px}.scene,.blank{aspect-ratio:3/1}.ghost,.primary{padding:9px 12px}}
.story p{margin:0 0 11px}.story p:last-child{margin-bottom:0}.story strong{font-weight:700}</style></head><body><main class="app"><header class="top"><div><div class="brand">MONOCUCOS</div><div class="sub">El Espacio de Movimiento</div></div><nav class="dots" id="dots" aria-label="Momentos"></nav><div class="age-picker" id="agePicker" aria-label="Seleccionar edad"></div></header><section class="stage" id="stage"></section><section class="learning"><h1 id="title"></h1><div class="story" id="story"></div><div class="age-line"><span class="small" id="counter"></span></div><div id="question"></div><div class="nav"><button class="ghost" id="back">← Anterior</button><button class="primary" id="next">Continuar</button></div></section><footer class="foot">Versión independiente de revisión · Unificación visual pendiente</footer></main><script>
const DATA=[{"title":"Allá arriba","story":"Pakik se acerca volando al aro amarillo. Para él, llegar hasta allí parece sencillo. Desde abajo, Gügo lo observa. Mira sus propias posibilidades de movimiento y después vuelve a mirar a Pakik. —¡Qué alto está! —dice Gügo—. Tú puedes llegar volando.","qs":[{"q":"¿Por qué creen que Gügo se queda mirando el aro?","opts":[{"t":"Porque le gustaría llegar hasta él.","r":["Gügo también quiere acercarse al aro. ¿Cómo podría sentirse?","Gügo desea llegar, pero observa que Pakik puede hacerlo volando. ¿Qué estará pensando?","Al ver cómo Pakik llega al aro, Gügo podría empezar a comparar sus capacidades. ¿Qué otras posibilidades aún no ha explorado?"]},{"t":"Porque cree que necesita volar como Pakik.","r":["Gügo ve a Pakik volar. ¿Será la única manera de llegar?","A veces creemos que debemos hacer las cosas como otros. ¿Y si hubiera otra manera?","Podemos confundir la manera en que alguien consigue algo con la única posibilidad. ¿Qué podría cambiar esa idea?"]},{"t":"Porque todavía no sabe cómo podría llegar.","r":["No saber cómo hacerlo no significa que no pueda probar.","Gügo aún no encuentra un camino. ¿Qué podría observar o preguntar?","Cuando no conocemos una solución, podemos explorar alternativas y reconocer qué apoyos necesitaríamos."]}]}],"close":["Gügo quiere llegar al aro, pero todavía no sabe cómo. Puede mirar y descubrir.","Gügo ve cómo vuela Pakik y empieza a preguntarse cómo podría llegar él. Todavía hay posibilidades por explorar.","Cuando vemos a alguien conseguir algo, podemos creer que debemos hacerlo igual. Gügo todavía no conoce todas sus posibilidades."],"paragraphs":["Pakik se acerca volando al aro amarillo. Para él, llegar hasta allí parece sencillo.","Desde abajo, Gügo lo observa. Mira sus propias posibilidades de movimiento y después vuelve a mirar a Pakik.",["Gügo","¡Qué alto está! Tú puedes llegar volando."]]},{"title":"Yo no soy como tú","story":"Gügo sigue mirando hacia arriba. —Es que yo no soy como tú —le dice a Pakik. Pakik lo escucha y responde: —No tienes que ser como yo. Todavía no sabemos cómo sería hacerlo a tu manera. Gügo vuelve a mirar el aro. Esta vez, también observa la escalera.","qs":[{"q":"¿Qué les parece lo que Pakik le responde a Gügo?","opts":[{"t":"Que no necesita ser igual a Pakik.","r":["Gügo puede ser él mismo. ¿Qué hace a su manera?","Pakik le recuerda que no tiene que ser igual. ¿Por qué ayuda escucharlo?","Pakik no le exige cambiar. ¿Qué diferencia hay entre acompañar y pedirle a alguien que nos imite?"]},{"t":"Que todavía pueden existir otras posibilidades.","r":["Gügo puede mirar alrededor. ¿Qué encontrará?","Pakik no promete que será fácil; deja abierta una posibilidad. ¿Eso puede dar confianza?","Dejar abierta una posibilidad es diferente de asegurar que todo se puede. ¿Por qué Pakik no promete el resultado?"]},{"t":"Que Pakik lo escucha sin burlarse.","r":["Pakik escucha con respeto. ¿Cómo se siente eso?","Pakik no se ríe de las dudas de Gügo. ¿Cómo ayuda que alguien nos escuche?","Pakik no minimiza sus dudas. ¿Por qué escuchar sin juzgar puede importar más que dar una solución?"]}]}],"close":["Gügo y Pakik son diferentes. Gügo no necesita tener alas para ser él mismo.","Gügo no tiene que hacer las cosas como Pakik. Puede descubrir otras maneras, aunque todavía tenga dudas.","La diferencia entre Gügo y Pakik es real, pero no define de antemano todas las posibilidades de Gügo."],"paragraphs":["Gügo sigue mirando hacia arriba.",["Gügo","Es que yo no soy como tú."],"Pakik lo escucha y responde:",["Pakik","No tienes que ser como yo. Todavía no sabemos cómo sería hacerlo a tu manera."],"Gügo vuelve a mirar el aro. Esta vez, también observa la escalera."]},{"title":"A mi manera","story":"Gügo se acerca a la escalera. No tiene alas. Pero puede sujetarse, avanzar y buscar dónde apoyarse. Comienza a subir. A veces se detiene para encontrar el siguiente apoyo. Pakik permanece cerca, atento, sin apresurarlo ni subir por él.","qs":[{"q":"¿Qué podría hacer Pakik mientras Gügo sube?","opts":[{"t":"Quedarse cerca por si necesita ayuda.","r":["Pakik puede quedarse cerca y escuchar.","Estar cerca no significa hacer todo por Gügo. ¿Cuándo ayudar y cuándo esperar?","Acompañar requiere reconocer cuándo alguien necesita apoyo y cuándo necesita espacio."]},{"t":"Preguntarle si quiere que lo ayude.","r":["Puede preguntar: «¿Quieres ayuda?».","Preguntar permite que Gügo diga qué necesita. ¿Por qué importa escucharlo?","Ayudar sin preguntar puede quitar autonomía. ¿Qué cambia cuando consultamos antes de intervenir?"]},{"t":"Animarlo sin decirle cómo tiene que hacerlo.","r":["Pakik puede decir: «Estoy aquí».","Pakik puede animarlo sin apurarlo. ¿Qué palabras le darían tranquilidad?","El ánimo también puede convertirse en presión. ¿Qué diferencia hay entre «Tómate tu tiempo» y «Tienes que llegar»?"]}]}],"close":["Gügo encontró una manera de subir. Va poquito a poquito, a su ritmo.","Gügo todavía no sabe si llegará hasta arriba. Pero descubrió que puede intentarlo de una manera diferente a la de Pakik.","Gügo empezó a descubrir sus posibilidades cuando dejó de pensar que debía hacer las cosas como Pakik. No sabe hasta dónde llegará, pero está explorando su propio camino."],"paragraphs":["Gügo se acerca a la escalera.","No tiene alas. Pero puede sujetarse, avanzar y buscar dónde apoyarse.","Comienza a subir.","A veces se detiene para encontrar el siguiente apoyo. Pakik permanece cerca, atento, sin apresurarlo ni subir por él."]},{"title":"Lo descubrí","story":"Después de avanzar poco a poco, Gügo llega hasta el aro. Mira hacia abajo. Allí está Pakik, celebrando con él. —¡Llegué! —exclama Gügo—. ¡Y no tuve que volar! Pakik lo mira feliz. —Encontraste tu manera. Gügo sonríe. Antes pensaba que no podía llegar porque no tenía alas. Ahora sabe que había una posibilidad que todavía no había descubierto.","qs":[{"q":"¿Por qué creen que Pakik celebra cuando Gügo llega?","opts":[{"t":"Porque está feliz por el descubrimiento de su amigo.","r":["Pakik está contento por Gügo.","¿Por qué podemos sentir alegría por algo que consigue otra persona?","Pakik celebra una posibilidad propia de Gügo, no que lo haya imitado. ¿Qué nos dice eso?"]},{"t":"Porque sabe que Gügo hizo el recorrido a su ritmo.","r":["Gügo subió poquito a poquito.","Pakik no lo apuró. ¿Cómo se sentiría Gügo si lo presionaran?","El tiempo que alguien necesita no disminuye el valor de lo que consigue. ¿Por qué?"]},{"t":"Porque pudieron compartir la alegría sin competir.","r":["No necesitan saber quién llegó primero.","¿Cómo cambia una experiencia cuando disfrutamos sin compararnos?","¿Qué cambia cuando reconocemos logros distintos en lugar de medirlos con una sola regla?"]}]}],"close":["¡Gügo llegó! No necesitó volar como Pakik. Encontró su propia manera.","Gügo pensaba que no podía llegar porque no tenía alas. Cuando se animó a intentarlo, descubrió una posibilidad que antes no conocía.","Gügo descubrió algo más que una manera de llegar al aro: comprendió que las capacidades de Pakik no tenían que definir sus propias posibilidades. Encontró su camino sin dejar de ser él mismo."],"paragraphs":["Después de avanzar poco a poco, Gügo llega hasta el aro.","Mira hacia abajo. Allí está Pakik, celebrando con él.",["Gügo","¡Llegué! ¡Y no tuve que volar!"],"Pakik lo mira feliz.",["Pakik","Encontraste tu manera."],"Gügo sonríe. Antes pensaba que no podía llegar porque no tenía alas. Ahora sabe que había una posibilidad que todavía no había descubierto."]},{"title":"El hilo que nos une","story":"Gügo encontró su manera de llegar al aro. Pakik lo acompañó sin burlarse de sus dudas ni exigirle que volara. Pero ¿qué habría pasado si alguien le hubiera dicho que era demasiado lento, que nunca llegaría o que no podía participar? A veces las palabras pueden hacer que alguien deje de intentarlo. También hay palabras y acciones que ayudan a que nadie se sienta menos por ser diferente.","qs":[{"q":"Si vieran que se burlan de Gügo por ser diferente, ¿qué podrían hacer?","opts":[{"t":"Acercarse a Gügo y escucharlo.","r":["Podemos preguntarle cómo se siente.","¿Por qué es mejor preguntar antes de decidir cómo ayudarlo?","¿Cómo ofrecer apoyo sin hablar por la otra persona?"]},{"t":"Decir que las burlas no están bien, si es seguro hacerlo.","r":["Podemos decir con calma: «Eso no está bien».","¿Cómo mostrar desacuerdo sin empezar otra pelea?","¿Qué cambia cuando alguien deja claro, de forma segura, que humillar no está bien?"]},{"t":"Buscar ayuda de un adulto de confianza.","r":["Pedir ayuda también es acompañar.","Si las burlas continúan, ¿a qué adulto podrían acudir?","Cuando hay intimidación, buscar ayuda protege. ¿Por qué no es una traición?"]}]}],"close":["Todos somos diferentes. Nadie merece burlas por eso. Podemos escucharnos, cuidarnos y jugar juntos.","Las diferencias no deberían dejar a nadie fuera. Cuando escuchamos, respetamos y buscamos maneras de participar juntos, ayudamos a que todos se sientan parte del grupo.","Las burlas y las comparaciones pueden hacer que alguien deje de participar o dude de sí mismo. Acompañar también significa reconocer esas situaciones, no reforzarlas y actuar para que nadie sea excluido por sus diferencias."],"paragraphs":["Gügo encontró su manera de llegar al aro. Pakik lo acompañó sin burlarse de sus dudas ni exigirle que volara.","Pero ¿qué habría pasado si alguien le hubiera dicho que era demasiado lento, que nunca llegaría o que no podía participar?","A veces las palabras pueden hacer que alguien deje de intentarlo. También hay palabras y acciones que ayudan a que nadie se sienta menos por ser diferente."]}]; const IMAGES=['momento-1.png','momento-2.png','momento-3.png','momento-4.png'];
let moment=0,step=0,age=1;const selections={};const $=id=>document.getElementById(id);
function render(){
 const m=DATA[moment], item=m.qs[0], idx=String(moment), selected=selections[idx];
 $('dots').innerHTML=DATA.map((_,i)=>`<button class="dot ${i===moment?'on':''}" title="Momento ${i+1}" aria-label="Ir al momento ${i+1}" onclick="go(${i})"></button>`).join('');
 $('agePicker').innerHTML=['4–5 años','6–8 años','9–10 años'].map((v,i)=>`<button type="button" class="${i===age?'active':''}" aria-pressed="${i===age}" onclick="setAge(${i})">${v}</button>`).join('');
 $('stage').innerHTML=moment<4?`<img class="scene" alt="Composición original aprobada del momento ${moment+1}" src="${IMAGES[moment]}">`:`<div class="blank"><span>El hilo que nos une<small style="display:block;margin-top:12px;font-size:14px">Presentación común pendiente de unificación</small></span></div>`;
 $('title').textContent=m.title;
 const story=$('story');story.replaceChildren();
 for(const paragraph of m.paragraphs){
   const p=document.createElement('p');
   if(Array.isArray(paragraph)){
     const name=document.createElement('strong');name.textContent=paragraph[0]+':';
     p.append(name,document.createTextNode(' —'+paragraph[1]));
   }else{p.textContent=paragraph}
   story.append(p);
 }
$('counter').textContent=`Momento ${moment+1} de 5`;
 const area=$('question');area.replaceChildren();
 const h=document.createElement('h2');h.className='question';h.textContent=item.q;area.append(h);
 const opts=document.createElement('div');opts.className='choices';item.opts.forEach((opt,i)=>{let b=document.createElement('button');b.type='button';b.textContent=opt.t;b.className=selected===i?'selected':'';b.setAttribute('aria-pressed',selected===i?'true':'false');b.onclick=()=>{selections[idx]=i;render()};opts.append(b)});area.append(opts);
 if(selected!==undefined){let refl=document.createElement('div');refl.className='reflection';let b=document.createElement('strong');b.textContent='Para pensar juntos';refl.append(b,document.createTextNode(item.opts[selected].r[age]));area.append(refl);let c=document.createElement('div');c.className='end';let label=document.createElement('b');label.textContent='Para llevar con nosotros';c.append(label,document.createTextNode(m.close[age]));area.append(c)}else{let tip=document.createElement('p');tip.className='small';tip.textContent='*Elige una opción para continuar';area.append(tip)}
 $('next').disabled=selected===undefined;$('next').textContent=moment===4?'Finalizar experiencia':moment===3?'Descubrir el hilo':'Continuar';$('back').disabled=moment===0;
}
function setAge(i){age=i;render()}
function go(i){moment=i;render()}
$('next').onclick=()=>{if(selections[String(moment)]===undefined)return;if(moment<4){moment++;render();window.scrollTo({top:0,behavior:'smooth'})}else{moment=0;for(const k in selections)delete selections[k];render();window.scrollTo({top:0,behavior:'smooth'})}};
$('back').onclick=()=>{if(moment>0){moment--;render();window.scrollTo({top:0,behavior:'smooth'})}};
render();
</script></body></html>
