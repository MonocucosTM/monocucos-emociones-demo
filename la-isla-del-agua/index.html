<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOCUCOS · La Isla del Agua</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ee;color:#263c40;font-family:Optima,'Palatino Linotype',Georgia,serif}.top{max-width:1120px;margin:auto;padding:15px 18px 10px}.brand{font-size:13px;letter-spacing:.12em;font-weight:bold}.title{font-size:clamp(20px,3vw,29px);margin:6px 0}.sub{font-size:13px;color:#607276}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}.steps{display:flex;gap:7px}.steps button{border:1px solid #a6bcb7;background:white;color:#29494a;border-radius:50%;width:34px;height:34px;cursor:pointer;font:inherit}.steps button.active{background:#315d62;color:white}.actions{display:flex;gap:8px}.actions button{border:1px solid #9db9b2;border-radius:22px;background:#fff;padding:9px 14px;font:inherit;cursor:pointer}.actions button.primary{background:#315d62;color:white}.actions button:disabled{opacity:.35;cursor:default}.frame{display:block;width:100%;height:calc(100vh - 160px);min-height:520px;border:0;background:#f8f5ee}.foot{max-width:1120px;margin:0 auto;padding:8px 18px 15px;color:#607276;font-size:12px}button:focus-visible{outline:3px solid #d3aa55;outline-offset:2px}@media(max-width:650px){.frame{height:calc(100vh - 210px);min-height:440px}.nav{justify-content:center}.top{text-align:center}}
</style></head><body><header class="top"><div class="brand">MONOCUCOS · LA ISLA DEL AGUA</div><h1 class="title" id="title">1 · La primera impresión</h1><div class="sub" id="counter">Momento 1 de 5</div><nav class="nav" aria-label="Navegación entre momentos"><div class="steps"><button type="button" data-i="0" onclick="go(0)" aria-label="Ir al momento 1: La primera impresión">1</button><button type="button" data-i="1" onclick="go(1)" aria-label="Ir al momento 2: El trato diferente">2</button><button type="button" data-i="2" onclick="go(2)" aria-label="Ir al momento 3: Las oportunidades">3</button><button type="button" data-i="3" onclick="go(3)" aria-label="Ir al momento 4: El valor de una persona">4</button><button type="button" data-i="4" onclick="go(4)" aria-label="Ir al momento 5: El hilo que nos une">5</button></div><div class="actions"><button onclick="go(0)">Inicio</button><button id="prev" onclick="go(current-1)">Anterior</button><button class="primary" id="next" onclick="go(current+1)">Siguiente momento</button></div></nav></header><iframe class="frame" id="scene" title="Contenido interactivo del momento 1" src="Momento_1.html"></iframe><footer class="foot">Prueba de integración: los momentos conservan sus archivos originales. Navega dentro de cada momento y usa «Siguiente momento» para continuar.</footer><script>
var names=["La primera impresión", "El trato diferente", "Las oportunidades", "El valor de una persona", "El hilo que nos une"];var current=0;function go(n){if(n<0||n>=5)return;current=n;document.getElementById('scene').src='Momento_'+(n+1)+'.html';document.getElementById('scene').title='Contenido interactivo del momento '+(n+1);document.getElementById('title').textContent=(n+1)+' · '+names[n];document.getElementById('counter').textContent='Momento '+(n+1)+' de 5';document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===4;document.querySelectorAll('.steps button').forEach(function(b,i){b.classList.toggle('active',i===n);b.setAttribute('aria-current',i===n?'step':'false')});window.scrollTo(0,0)}go(0);
</script></body></html>
