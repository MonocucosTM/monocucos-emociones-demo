</style></head><body><header class="header"><h1>El Rincón Tranquilo</h1><p>Conocer antes de juzgar</p><a class="back" href="../prueba-islas-v9/">← Volver al mapa de las islas</a></header><iframe id="recorrido" title="El Rincón Tranquilo" onload="ocultarDuplicados(this)" src="Rincon_Tranquilo_recorrido_integrado_textos_corregidos.html" allowfullscreen></iframe><script>function ocultarDuplicados(frame){try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='.top .brand,.top .sub{display:none!important}.top{justify-content:flex-end!important}';doc.head.appendChild(style);function cleanMoment(inner){try{const d=inner.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='main.wrap > header{display:none!important}';d.head.appendChild(st)}catch(e){}}doc.querySelectorAll('.frame-shell iframe').forEach(inner=>{inner.addEventListener('load',()=>cleanMoment(inner));if(inner.contentDocument?.readyState==='complete')cleanMoment(inner)})}catch(e){console.warn('No se pudo ajustar el encabezado interno',e)}}</script></body></html>
