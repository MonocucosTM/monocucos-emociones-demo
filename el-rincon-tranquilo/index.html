<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Rincón Tranquilo · MONOCUCOS</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#f8f6ef;font-family:Optima,'Palatino Linotype',Georgia,serif;color:#413747}
.header{width:min(100%,760px);margin:0 auto;padding:16px 16px 10px;flex-shrink:0}.header-main{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.age-buttons{display:flex;gap:7px;flex-wrap:wrap}.age-buttons button{font:inherit;border:1px solid #d8c9c0;background:#fff;border-radius:24px;padding:10px 14px;cursor:pointer}.age-buttons button[aria-pressed=true]{background:#ffe0a0;border-color:#dba539}.header h1{font-size:22px;font-weight:700;margin:0 0 3px}.header p{font-size:14px;margin:0 0 8px;color:#756978}.back{display:inline-block;color:#315d62;text-decoration:underline;font-size:14px;padding:5px 0}
iframe{flex:1;width:min(100%,760px);max-width:100%;margin:0 auto;border:0;min-height:0;display:block;background:#f8f6ef}
@media(max-width:650px){.header{padding:12px 12px 6px}.header h1{font-size:20px}}
</style></head><body><header class="header"><div class="header-main"><div><h1>El Rincón Tranquilo</h1><p>Conocer antes de juzgar</p></div><div class="age-buttons" role="group" aria-label="Edad para las reflexiones"><button type="button" data-age="4" aria-pressed="false" onclick="elegirEdad(4)">4–5 años</button><button type="button" data-age="6" aria-pressed="true" onclick="elegirEdad(6)">6–8 años</button><button type="button" data-age="9" aria-pressed="false" onclick="elegirEdad(9)">9–10 años</button></div></div><a class="back" href="../prueba-islas-v9/">← Volver al mapa de las islas</a></header><iframe id="recorrido" title="El Rincón Tranquilo" onload="ocultarDuplicados(this)" src="Rincon_Tranquilo_recorrido_integrado_textos_corregidos.html" allowfullscreen></iframe><script>
let edadElegida='6';
function marcarEdad(){document.querySelectorAll('.age-buttons button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===edadElegida)))}
function aplicarEdad(doc){try{const select=doc.getElementById('age');if(select){if(select.value!==edadElegida){select.value=edadElegida;select.dispatchEvent(new Event('change',{bubbles:true}))}const line=select.closest('.age-line');if(line)line.style.display='none';if(!select.dataset.sincronizado){select.dataset.sincronizado='1';select.addEventListener('change',()=>{edadElegida=select.value;marcarEdad()})}}}catch(e){}}
function elegirEdad(n){edadElegida=String(n);marcarEdad();try{const doc=document.getElementById('recorrido').contentDocument;doc.querySelectorAll('.frame-shell iframe').forEach(f=>{if(f.contentDocument)aplicarEdad(f.contentDocument)});const closing=doc.getElementById('ages');if(closing){const i={'4':0,'6':1,'9':2}[edadElegida];if(typeof doc.defaultView.setAge==='function')doc.defaultView.setAge(i)}}catch(e){}}
function ocultarDuplicados(frame){try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='.top .brand,.top .sub{display:none!important}.top{justify-content:flex-end!important}';doc.head.appendChild(style);
function ajustar(inner){try{const d=inner.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='main.wrap > header{display:none!important}.age-line{display:none!important}';d.head.appendChild(st);aplicarEdad(d)}catch(e){}}
doc.querySelectorAll('.frame-shell iframe').forEach(inner=>{inner.addEventListener('load',()=>ajustar(inner));if(inner.contentDocument?.readyState==='complete')ajustar(inner)});
}catch(e){console.warn('No se pudo ajustar el encabezado interno',e)}}
</script></body></html>
