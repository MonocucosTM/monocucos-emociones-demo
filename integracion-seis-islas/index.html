<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOCUCOS · Todos tenemos un lugar</title>
<style>body{margin:0;background:#f8f6ef;color:#304638;font-family:Optima,Palatino,serif}main{max-width:1200px;margin:auto;padding:18px}header{text-align:center;margin-bottom:16px}h1{font-weight:500}.scene{position:relative;aspect-ratio:3/2;background:#dcebe8;border-radius:18px;overflow:hidden}.scene img{position:absolute;inset:0;width:100%;height:100%}.hot{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer}.hot:focus-visible{outline:3px solid #c99a38}.card{position:absolute;z-index:3;background:#fffdf4f2;border:1px solid #c9ad76;border-radius:14px;box-shadow:0 8px 28px #20392e55;padding:15px;width:min(32%,310px);transform:translate(-50%,-50%)}.card[hidden]{display:none}.card h2{margin:0 0 6px;font-size:1.2rem}.card p{margin:0 0 12px;line-height:1.4}.card a{color:#315740}.note{text-align:center;font-size:.85rem;margin-top:12px}@media(max-width:650px){main{padding:8px}.card{top:auto!important;left:50%!important;bottom:2%;transform:translateX(-50%);width:75%;font-size:.8rem;padding:10px}.card h2{font-size:1rem}}</style></head><body><main><header><div>MONOCUCOS · APRENDER MONOCUQUEANDO</div><h1>Todos tenemos un lugar</h1><p>Descubre las islas y elige cuál quieres explorar</p></header><div class="scene" id="scene"><img src="https://raw.githubusercontent.com/MonocucosTM/monocucos-emociones-demo/main/aprender-monocuqueando/todos-tenemos-un-lugar/escenario-maestro.png" alt="Escenario maestro original de seis islas"><button class="hot" style="left:1%;top:25%;width:17%;height:21%" data-id="mirador" aria-label="El Mirador"></button><button class="hot" style="left:38%;top:11%;width:15%;height:20%" data-id="rincon" aria-label="El Rincón Tranquilo"></button><button class="hot" style="left:72%;top:48%;width:24%;height:17%" data-id="agua" aria-label="La Isla del Agua"></button><section id="card" class="card" hidden><h2 id="name"></h2><p id="desc"></p><span id="status">Integración de la historia pendiente de publicación</span></section></div><p class="note">Versión de preparación técnica. Las historias aún no están conectadas en línea.</p></main><script>const items={mirador:{name:'El Mirador',desc:'Desde lo alto, Issa y Uli descubren que no todos vemos el mundo de la misma manera.',x:'29%',y:'33%'},rincon:{name:'El Rincón Tranquilo',desc:'En un rincón de este universo, Rulo tiene su propia manera de encontrar la calma.',x:'61%',y:'23%'},agua:{name:'La Isla del Agua',desc:'En esta isla, el agua encuentra muchos caminos. Algunos nadan, otros se arrastran y otros descubren maneras de llegar. ¿Te gustaría conocerla?',x:'66%',y:'71%'}};const card=document.getElementById('card');document.querySelectorAll('.hot').forEach(b=>{function show(){const i=items[b.dataset.id];document.getElementById('name').textContent=i.name;document.getElementById('desc').textContent=i.desc;card.style.left=i.x;card.style.top=i.y;card.hidden=false}b.addEventListener('click',show);b.addEventListener('mouseenter',show)});document.addEventListener('keydown',e=>{if(e.key==='Escape')card.hidden=true});</script></body></html>
